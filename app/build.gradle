plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thirakkatha.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thirakkatha.app'
        minSdk 24
        targetSdk 34
        // Raise versionCode by 1 every time you publish an update
        versionCode 1
        versionName '1.0'
    }

    // A fixed signing key, so every new build installs over the old one without losing your scripts.
    // For the Play Store, replace this with your own private key.
    signingConfigs {
        fixed {
            storeFile file('thirakkatha.keystore')
            storePassword 'thirakkatha'
            keyAlias 'thirakkatha'
            keyPassword 'thirakkatha'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
