  const base=opts.map(o=>o[0]);
  const res=[assemble(tk,base)];
  const amb=[]; opts.forEach((o,i)=>{ if(o.length>1) amb.push(i); });
  // first-syllable vowel first (length is the commonest slip), then consonants, then other vowels
  const fv=tk.findIndex(x=>x.t==="V");
  amb.sort((a,b)=>rank(a)-rank(b));
  function rank(i){ return i===fv?0 : tk[i].t==="C"?1 : i===tk.length-1?1.5 : 2; }
  const singles=[];
  for(const i of amb) for(let j=1;j<opts[i].length;j++){ const p=base.slice(); p[i]=opts[i][j]; singles.push(p); }
  singles.forEach(p=>res.push(assemble(tk,p)));
  if(amb.length<=6){
    for(let a=0;a<amb.length&&res.length<40;a++) for(let b=a+1;b<amb.length&&res.length<40;b++){
      const p=base.slice(); p[amb[a]]=opts[amb[a]][1]; p[amb[b]]=opts[amb[b]][1]; res.push(assemble(tk,p));
    }
  }
