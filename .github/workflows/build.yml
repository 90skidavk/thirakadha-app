orma ഓർമ്മ|ormma ഓർമ്മ|ayyo അയ്യോ|scene സീൻ|cut കട്ട്|camera ക്യാമറ|flashback ഫ്ലാഷ്ബാക്ക്|thudarunnu തുടരുന്നു|akam അകം|puram പുറം`;
const DICT={};
DICT_SRC.split(/[|\n]/).forEach(e=>{ e=e.trim(); if(!e) return; const sp=e.indexOf(" "); const k=normKey(e.slice(0,sp));
  DICT[k]=(DICT[k]||[]).concat(e.slice(sp+1).split(",")); });

/* ---- Word endings: stem from the dictionary + a common ending (ammayude, kuttikalum, santhoshamayi…) ---- */
const VSUF=[["ayirunnu","aa","യിരുന്നു"],["ilekku","i","ലേക്ക്"],["umayi","u","മായി"],["allo","a","ല്ലോ"],["alla","a","ല്ല"],["alle","a","ല്ലേ"],["illa","i","ല്ല"],["ille","i","ല്ലേ"],
 ["undu","u","ണ്ട്"],["undo","u","ണ്ടോ"],["inte","i","ന്റെ"],["ekku","ee","ക്ക്"],["ilum","i","ലും"],["okke","o","ക്കെ"],["akum","aa","കും"],
 ["anu","aa","ണ്"],["ano","aa","ണോ"],["ayi","aa","യി"],["ude","u","ടെ"],["inu","i","ന്"],["odu","oo","ട്"],["ode","oo","ടെ"],["ile","i","ലെ"],
 ["um","u","ം"],["il","i","ൽ"],["e","e",""],["o","oo",""]];
const OBL=new Set(["il","inte","inu","e","ekku","ilekku","ode","odu","ile","ilum"]);
const UNCHILLU={"ൻ":"ന","ൾ":"ള","ർ":"ര","ൽ":"ല","ൺ":"ണ"};
const SIGNS="ാിീുൂെേൈൊോൗൃ";
function stemOf(key,depth){ return userDict[key] || (DICT[key]&&DICT[key][0]) || (depth>0?morph(key,depth-1):null); }
function morph(key,depth){
  const end=s=>s[s.length-1];
  for(const [raw,v,rest] of VSUF){
    if(!key.endsWith(raw)) continue;
    const base=key.slice(0,-raw.length); if(base.length<2) continue;
    const sign=VSIGN[v][0]; let st;
    if((st=stemOf(base,depth))){
      if(end(st)==="ം"){ if(raw!=="um"&&!OBL.has(raw)) return st.slice(0,-1)+"മ"+sign+rest; }
      else if(UNCHILLU[end(st)]) return st.slice(0,-1)+UNCHILLU[end(st)]+sign+rest;
    }
    if((st=stemOf(base+"u",depth)) && end(st)==="്") return st.slice(0,-1)+sign+rest;
    if(base.endsWith("y") && (st=stemOf(base.slice(0,-1),depth)) && !"ം്".includes(end(st)) && !UNCHILLU[end(st)]) return st+"യ"+sign+rest;
    if(raw==="um" && base.endsWith("v") && (st=stemOf(base.slice(0,-1)+"m",depth)) && end(st)==="ം") return st.slice(0,-1)+"വും";
    if(OBL.has(raw) && base.endsWith("th") && (st=stemOf(base.slice(0,-2)+"m",depth)) && end(st)==="ം") return st.slice(0,-1)+"ത്ത"+sign+rest;
  }
  let st, b;
  if(key.endsWith("kku") && (b=key.slice(0,-3)).length>=2 && (st=stemOf(b,depth))){
    if(UNCHILLU[end(st)]||SIGNS.includes(end(st))) return st+"ക്ക്";
    if(!"ം്".includes(end(st))) return st+"യ്ക്ക്";
  }
  if(key.endsWith("ngal") && (st=stemOf(key.slice(0,-4)+"m",depth)) && end(st)==="ം") return st.slice(0,-1)+"ങ്ങൾ";
  if(key.endsWith("kal") && (b=key.slice(0,-3)).length>=2 && (st=stemOf(b,depth))){
    if(end(st)==="്") return st.slice(0,-1)+"ുകൾ";
    if(end(st)!=="ം") return st+"കൾ";
  }
  if(key.endsWith("te") && (st=stemOf(key.slice(0,-2),depth)) && end(st)==="ൻ") return st.slice(0,-1)+"ന്റെ";
  return null;
}

let userDict={};            // learned corrections: normKey → Malayalam
const candCache=new Map();
function wordCands(raw){
  if(candCache.has(raw)) return candCache.get(raw);
  let out;
  const letters=raw.replace(/~/g,"");
  if(letters.length>=2 && letters===letters.toUpperCase()){            // INT, EXT, CUT TO stay English
    out=[raw, ...ruleCands(raw.toLowerCase()).slice(0,3)]; var sure=true;
  } else {
    let w=raw;
    if(/^[A-Z][a-z~]*$/.test(w)) w=w.toLowerCase();                    // sentence-case from a PC keyboard
    const plain=w===w.toLowerCase(), key=normKey(w);
    out=[];
    if(plain && userDict[key]) out.push(userDict[key]);
    if(plain && DICT[key]) out.push(...DICT[key]);
    else if(plain){ const m=morph(key,2); if(m) out.push(m); }
    var sure=out.length>0;
    out.push(...ruleCands(w));
    out=[...new Set(out)].slice(0,8); out.push(raw);
  }
  out=[...new Set(out)]; out.sure=sure;
  candCache.set(raw,out); return out;
}
function learn(raw,ml){ userDict[normKey(raw)]=ml; candCache.clear(); }
/* Split a line into pieces: Manglish words get converted, everything else passes through */
function convertLine(text){
  const parts=[]; const re=/\{([^}]*)\}|([A-Za-z~]+)|([^A-Za-z~{]+|\{)/g; let m;
  while((m=re.exec(text))){
    if(m[1]!==undefined) parts.push({raw:m[0],ml:m[1],word:false,start:m.index});
    else if(m[2]){ const c=wordCands(m[2]); parts.push({raw:m[2],ml:c[0],cands:c,word:true,start:m.index}); }
    else parts.push({raw:m[0],ml:m[0],word:false,start:m.index});
  }
  return {ml:parts.map(p=>p.ml).join(""),parts};
}
const translit=t=>convertLine(t).ml;

/* =====================================================================
   APP
   ===================================================================== */
const TYPES=[["scene","Scene"],["action","Action"],["character","Character"],["paren","(Paren)"],["dialogue","Dialogue"],["transition","Transition"]];
const NEXT={scene:"action",action:"action",character:"dialogue",paren:"dialogue",dialogue:"action",transition:"scene"};
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const keepFocus=b=>b.addEventListener("pointerdown",e=>e.preventDefault());
const newScript=()=>({id:uid(),title:"",author:"",contact:"",blocks:[],driveIds:{}});

const NATIVE=window.ThkNative||null;   // set when running inside the Android app
let script=newScript(), index=[];
let settings={ai:true,theme:"auto",layout:"std",fs:1,userDict:{},gclient:"",current:null};
let curType="scene", selId=null, insertAfter=null, listening=false, manualFocus=null;

/* ---------- Storage (Claude storage inside Claude, browser storage on your own site) ---------- */
const LS="local"+"Storage";
const store={
  async get(k){ if(window.storage){ try{ const r=await window.storage.get(k,false); return r?r.value:null; }catch(e){ return null; } }
    try{ return window[LS].getItem(k); }catch(e){ return null; } },
  async set(k,v){ if(window.storage){ try{ return !!(await window.storage.set(k,v,false)); }catch(e){ return false; } }
    try{ window[LS].setItem(k,v); return true; }catch(e){ return false; } },
  async del(k){ if(window.storage){ try{ await window.storage.delete(k,false); }catch(e){} return; }
    try{ window[LS].removeItem(k); }catch(e){} }
};
let saveT,setT;
function save(){ clearTimeout(saveT); $("saved").textContent="Saving…"; saveT=setTimeout(flush,700); }
async function flush(){
  clearTimeout(saveT);
  const inIndex=index.find(x=>x.id===script.id);
  if(!inIndex && !script.blocks.length && !script.title){ $("saved").textContent=""; return; }
  const clean={...script,blocks:script.blocks.map(({id,type,text})=>({id,type,text}))};
  const ok=await store.set("thk:s:"+script.id,JSON.stringify(clean));
  const meta={id:script.id,title:script.title||"Untitled script",updated:Date.now()};
  if(inIndex) Object.assign(inIndex,meta); else index.unshift(meta);
  await store.set("thk:index",JSON.stringify(index));
  $("saved").textContent=ok?"Saved":"";
}
function saveSettings(){ clearTimeout(setT); setT=setTimeout(()=>{ settings.userDict=userDict; store.set("thk:settings",JSON.stringify(settings)); },500); }
async function load(){
  try{
    const s=await store.get("thk:settings"); if(s) Object.assign(settings,JSON.parse(s));
    userDict=settings.userDict||{};
    const ix=await store.get("thk:index"); if(ix) index=JSON.parse(ix)||[];
    if(index.length){
      const id=settings.current&&index.find(x=>x.id===settings.current)?settings.current:index[0].id;
      const v=await store.get("thk:s:"+id); if(v) script=Object.assign(newScript(),JSON.parse(v));
    } else {                                   // bring over a script from the earlier version
      const old=await store.get("malscript:current");
      if(old){ const d=JSON.parse(old); if(d.script&&d.script.blocks&&d.script.blocks.length) script=Object.assign(newScript(),d.script,{id:uid()}); }
      const og=await store.get("malscript:gclient"); if(og&&!settings.gclient) settings.gclient=og;
    }
  }catch(e){}
  gClientId=settings.gclient||GOOGLE_CLIENT_ID;
  openScript(script);
  if(script.blocks.length) save();
}
function openScript(s){
  script=s; script.driveIds=script.driveIds||{};
  script.blocks.forEach(b=>{ delete b.pending; if(!b.id) b.id=uid(); });
  settings.current=script.id; undoStack=[]; redoStack=[]; selId=null; insertAfter=null;
  $("title").value=script.title||""; $("authorInp").value=script.author||""; $("contactInp").value=script.contact||"";
  const last=script.blocks[script.blocks.length-1]; curType=last?NEXT[last.type]:"scene";
  applyView(); setAi(settings.ai,true); render(); renderChips(); updateComposer(); updateUndoBtns(); updateDriveUI(); saveSettings();
}

/* ---------- Undo ---------- */
let undoStack=[],redoStack=[];
const snap=()=>JSON.stringify({t:script.title,b:script.blocks.map(({id,type,text})=>({id,type,text}))});
function pushUndo(s){ undoStack.push(s||snap()); if(undoStack.length>100) undoStack.shift(); redoStack=[]; updateUndoBtns(); }
function restore(s){ const d=JSON.parse(s); script.title=d.t; script.blocks=d.b; $("title").value=d.t; selId=null; insertAfter=null; render(); renderChips(); save(); updateUndoBtns(); }
function undo(){ if(!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); }
function redo(){ if(!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }
function updateUndoBtns(){ $("undoBtn").disabled=!undoStack.length; $("redoBtn").disabled=!redoStack.length; }
$("undoBtn").onclick=undo; $("redoBtn").onclick=redo;

/* ---------- Script page ---------- */
function characters(){
  const m=new Map();
  script.blocks.forEach(b=>{ if(b.type!=="character") return; const n=b.text.replace(/\s*\(.*\)\s*$/,"").trim(); if(n) m.set(n,(m.get(n)||0)+1); });
  return new Map([...m].sort((a,b)=>b[1]-a[1]));
}
let editSnap=null, editOrig="";
function render(){
  const page=$("page"); page.className="page"+(settings.layout==="two"?" two":""); page.innerHTML="";
  if(script.title){
    const tp=el("div"); tp.id="printTitle";
    tp.innerHTML="<h1>"+esc(script.title)+"</h1>"+(script.author?"<p>Written by</p><p><b>"+esc(script.author)+"</b></p>":"")+(script.contact?'<p style="margin-top:30pt">'+esc(script.contact)+"</p>":"");
    page.appendChild(tp);
  }
  if(!script.blocks.length){
    page.insertAdjacentHTML("beforeend",'<div class="empty">Your script starts here.<br>Type <b>INT. veedu - raathri</b> for a scene heading,<br>then describe the action: <b>raju vathil thurannu akathekku varunnu</b><br>or tap the mic and speak.</div>');
    renderSide(); return;
  }
  script.blocks.forEach(b=>{
    const d=el("div","blk "+b.type+(b.pending?" pending":"")+(b.id===selId?" sel":""));
    d.contentEditable=!b.pending; d.dataset.id=b.id; d.textContent=b.text; d.spellcheck=false;
    d.oninput=()=>{ b.text=d.textContent; save(); };
    d.onfocus=()=>{ selId=b.id; editSnap=snap(); editOrig=b.text;
      document.querySelectorAll(".blk.sel").forEach(x=>x.classList.remove("sel")); d.classList.add("sel"); renderChips(); };
    d.onblur=()=>{ if(b.text!==editOrig){ pushUndo(editSnap); editOrig=b.text; renderSide(); } };
    d.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); d.blur(); } };
    d.onpaste=e=>{ e.preventDefault(); document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text").replace(/\s*\n\s*/g," ")); };
    page.appendChild(d);
    if(b.id===insertAfter){ const h=el("div","here","New lines go here · tap to cancel"); h.onclick=()=>{ insertAfter=null; render(); }; page.appendChild(h); }
  });
  renderSide();
}
function renderSide(){
  const sn=$("sceneNav"), cn=$("charNav"); sn.innerHTML=""; cn.innerHTML="";
  let n=0;
  script.blocks.forEach(b=>{ if(b.type!=="scene") return; n++;
    const bt=el("button","navitem"); bt.innerHTML="<i>"+n+"</i><span>"+esc(b.text||"…")+"</span>";
    bt.onclick=()=>{ closeSide(); jumpTo(b.id); }; sn.appendChild(bt); });
  if(!n) sn.appendChild(el("div","sidenote","Scene headings appear here so you can jump between them."));
  const ch=characters();
  ch.forEach((c,name)=>{ const bt=el("button","navitem"); bt.innerHTML="<span>"+esc(name)+"</span><small>"+c+"</small>";
    bt.title="Start a dialogue for "+name;
    bt.onclick=()=>{ closeSide(); quickCommit("character",name); $("inp").focus(); }; cn.appendChild(bt); });
  cn.appendChild(el("div","sidenote",ch.size?"Tap a name to start their next dialogue.":"Characters appear here once they speak."));
  const st=stats(); $("statMini").innerHTML="<span>"+n+" scene"+(n===1?"":"s")+"</span><span>about "+st.pages+" page"+(st.pages===1?"":"s")+"</span>";
  $("libCount").textContent=index.length?index.length+" saved":"";
}
function jumpTo(id){ const d=document.querySelector('.blk[data-id="'+id+'"]'); if(d) d.scrollIntoView({block:"start",behavior:"smooth"}); }
function scrollToNew(){
  requestAnimationFrame(()=>{ if(insertAfter){ const d=document.querySelector('.blk[data-id="'+insertAfter+'"]'); if(d) d.scrollIntoView({block:"center"}); }
    else { const m=$("main"); m.scrollTop=m.scrollHeight; } });
}
function clearSel(){ if(!selId) return; selId=null; document.querySelectorAll(".blk.sel").forEach(x=>x.classList.remove("sel")); renderChips(); }
function addBlock(type,text,pending=false){
  if(type==="paren" && text && !/^\(.*\)$/.test(text.trim())) text="("+text.trim()+")";
  const b={id:uid(),type,text,pending};
  if(insertAfter){ const i=script.blocks.findIndex(x=>x.id===insertAfter);
    if(i>-1){ script.blocks.splice(i+1,0,b); insertAfter=b.id; return b; } insertAfter=null; }
  script.blocks.push(b); return b;
}
function afterAdd(){ render(); renderChips(); updateComposer(); save(); scrollToNew(); }
function quickCommit(type,text){ pushUndo(); addBlock(type,text); curType=NEXT[type]; afterAdd(); }

/* ---------- Line type chips and selected-line actions ---------- */
function renderChips(){
  const nav=$("chips"); nav.querySelectorAll(".chip").forEach(e=>e.remove());
  const sel=selId&&script.blocks.find(b=>b.id===selId);
  const active=sel?sel.type:curType;
  $("chipHint").textContent=sel?"Selected line:":"Next line:";
  TYPES.forEach(([t,l])=>{
    const b=el("button","chip",l); b.setAttribute("aria-pressed",t===active); keepFocus(b);
    b.onclick=()=>{ if(sel){ pushUndo(); sel.type=t; render(); save(); } else { curType=t; updateComposer(); } renderChips(); };
    nav.appendChild(b);
  });
  const bar=$("selBar"); bar.innerHTML=""; bar.hidden=!sel; if(!sel) return;
  const act=(label,fn,cls)=>{ const b=el("button","chip"+(cls?" "+cls:""),label); keepFocus(b); b.onclick=fn; bar.appendChild(b); };
  const idx=()=>script.blocks.findIndex(b=>b.id===selId);
  const move=d=>{ const i=idx(), j=i+d; if(j<0||j>=script.blocks.length) return; pushUndo();
    [script.blocks[i],script.blocks[j]]=[script.blocks[j],script.blocks[i]]; render(); save(); jumpSel(); };
  const jumpSel=()=>{ const d=document.querySelector('.blk[data-id="'+selId+'"]'); if(d) d.scrollIntoView({block:"nearest"}); };
  act("↑ Move up",()=>move(-1)); act("↓ Move down",()=>move(1));
  act("Insert below",()=>{ insertAfter=selId; document.activeElement.blur(); selId=null; render(); renderChips(); $("inp").focus(); },"gold");
  act("Duplicate",()=>{ pushUndo(); const i=idx(); const s=script.blocks[i]; script.blocks.splice(i+1,0,{id:uid(),type:s.type,text:s.text}); render(); save(); });
  act("AI tools",()=>openAi(),"gold");
  act("Delete",()=>{ pushUndo(); script.blocks=script.blocks.filter(b=>b.id!==selId); if(insertAfter===selId) insertAfter=null; selId=null; render(); renderChips(); save(); },"danger");
}

/* ---------- Composer: Manglish in, Malayalam out ---------- */
const inp=$("inp");
const QUICK={
  scene:["INT. ","EXT. ","അകം - ","പുറം - ","പകൽ","രാത്രി","സന്ധ്യ","പ്രഭാതം"],
  transition:["CUT TO:","കട്ട് ടു","FADE IN:","FADE OUT.","ഡിസോൾവ്","ഇന്റർകട്ട്"],
  paren:["(ദേഷ്യത്തോടെ)","(ചിരിച്ചുകൊണ്ട്)","(പതുക്കെ)","(കരഞ്ഞുകൊണ്ട്)","(ഫോണിൽ)","(V.O.)","(O.S.)"]
};
function updateComposer(){
  if(listening) return;
  const v=inp.value, conv=convertLine(v), pv=$("preview"), cb=$("cands");
  pv.className=""; pv.innerHTML=""; cb.innerHTML="";
  pv.appendChild(el("span","lbl",(TYPES.find(t=>t[0]===curType)||[])[1]));
  // which word are the suggestions for? the one at the cursor, unless a preview word was tapped
  const caret=document.activeElement===inp?inp.selectionStart:v.length;
  let focus=null;
  conv.parts.forEach((p,i)=>{ if(!p.word) return;
    if(manualFocus===i) focus=p;
    else if(manualFocus===null && p.start<=caret) focus=p; });
  conv.parts.forEach((p,i)=>{
    if(!p.word){ pv.appendChild(document.createTextNode(p.ml)); return; }
    const s=el("span","w"+(p.cands.sure?"":" unsure")+(p===focus?" on":""),p.ml);
    s.addEventListener("pointerdown",e=>e.preventDefault());
    s.onclick=()=>{ manualFocus=i; updateComposer(); };
    pv.appendChild(s);
  });
  const chip=(label,fn,cls)=>{ const b=el("button","cand"+(cls?" "+cls:""),label); keepFocus(b); b.onclick=fn; cb.appendChild(b); return b; };
  if(!v.trim()){
    if(curType==="scene") QUICK.scene.forEach(q=>chip(q.trim(),()=>{ inp.value+=(inp.value&&!/\s$/.test(inp.value)?" ":"")+q; inp.focus(); autosize(); updateComposer(); },/[A-Z]/.test(q)?"eng":""));
    else if(curType==="transition"||curType==="paren") QUICK[curType].forEach(q=>chip(q,()=>quickCommit(curType,q),/[A-Z]/.test(q)?"eng":""));
    else if(curType==="character"&&characters().size) characters().forEach((c,name)=>chip(name,()=>quickCommit("character",name)));
    else cb.appendChild(el("span","candHint","Spelling choices appear here as you type"));
    return;
  }
  if(curType==="character"){ const t=conv.ml.trim(); characters().forEach((c,name)=>{ if(name!==t&&name.startsWith(t.slice(0,2))) chip(name,()=>{ inp.value=""; quickCommit("character",name); },"on"); }); }
  if(focus) focus.cands.forEach((c,j)=>chip(c,()=>{ learn(focus.raw,c); saveSettings(); updateComposer(); },(j===0?"on":"")+(c===focus.raw?" eng":"")));
}
function autosize(){ inp.style.height="auto"; inp.style.height=Math.min(inp.scrollHeight,120)+"px"; }
function lineFrom(type,raw){
  const c=convertLine(raw);
  const needAI=!NATIVE&&settings.ai&&aiOK&&c.parts.some(p=>p.word&&!p.cands.sure);
  const b=addBlock(type,c.ml,needAI);
  if(needAI) polish(b.id,type,raw,c);
}
function commit(){
  const raw=inp.value.replace(/\n/g," ").trim(); inp.value=""; manualFocus=null; autosize();
  if(!raw){ updateComposer(); return; }
  pushUndo();
  // obvious line types are recognised whatever type is selected
  const auto=/^\(.+\)$/.test(raw)?"paren" : /^(INT|EXT|int|ext)\.(\s|\/|$)/.test(raw)?"scene" : /^(CUT TO|FADE IN|FADE OUT|DISSOLVE TO|SMASH CUT|INTERCUT)\b/.test(raw)?"transition" : null;
  const colon=!auto&&raw.match(/^([^:{}]{1,30}):\s*(.+)$/);
  if(auto){ lineFrom(auto,raw); curType=NEXT[auto]; }
  else if(colon && ["action","character","dialogue"].includes(curType)){
    lineFrom("character",colon[1].trim()); lineFrom("dialogue",colon[2]); curType="action";
  } else { lineFrom(curType,raw); curType=NEXT[curType]; }
  afterAdd();
}
inp.addEventListener("input",()=>{ manualFocus=null; if(inp.value.includes("\n")){ commit(); return; } autosize(); updateComposer(); });
inp.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); commit(); }
  else if(e.key==="Tab"){ e.preventDefault(); const i=TYPES.findIndex(t=>t[0]===curType); curType=TYPES[(i+(e.shiftKey?5:1))%6][0]; renderChips(); updateComposer(); }
});
inp.addEventListener("keyup",e=>{ if(e.key.startsWith("Arrow")){ manualFocus=null; updateComposer(); } });
inp.addEventListener("click",()=>{ manualFocus=null; updateComposer(); });
inp.addEventListener("focus",clearSel);
$("add").onclick=()=>{ commit(); inp.focus(); };
$("title").oninput=e=>{ script.title=e.target.value; save(); };
$("authorInp").oninput=e=>{ script.author=e.target.value; save(); };
$("contactInp").oninput=e=>{ script.contact=e.target.value; save(); };
$("main").addEventListener("pointerdown",e=>{ if(!e.target.closest(".blk")) clearSel(); });

/* ---------- AI (works inside Claude) ---------- */
let aiOK=true, aiFails=0;
function setAi(v,silent){ settings.ai=v; if(v){ aiOK=true; aiFails=0; } $("aiTog").setAttribute("aria-checked",v); if(!silent) saveSettings(); }
$("aiTog").onclick=()=>{ setAi(!settings.ai); toast(settings.ai?"AI polish on: guessed words are corrected after you press Enter":"AI polish off: the built-in engine and your saved choices are used"); };
function aiFailed(){ aiFails++; if(aiFails>=2&&settings.ai){ aiOK=false; setAi(false); toast("AI isn't reachable here, so AI polish is off. The built-in engine still works."); } }
async function callClaude(system,user){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system,messages:[{role:"user",content:user}]})});
  if(!res.ok) throw new Error("API "+res.status);
  const data=await res.json(); aiFails=0;
  return data.content.map(c=>c.type==="text"?c.text:"").join("").trim();
}
const recent=n=>script.blocks.filter(b=>!b.pending).slice(-n).map(b=>b.type+": "+b.text).join("\n")||"(none)";
const SYS_CONVERT="You convert Manglish (Malayalam typed casually in English letters) into correct, natural Malayalam script for a film screenplay, spelled the way a native writer would. You get the typed Manglish and a rough machine conversion; fix wrong letters, vowel lengths, chillus and doubled consonants. Do not change the wording, add or drop words, or merge words. Text already in Malayalam stays as is. ALL-CAPS words and screenplay terms (INT., EXT., CUT TO, V.O.) stay in English. Spell character names the same way as in the known list. Keep punctuation. Output ONLY the corrected line.";
async function polish(id,type,raw,c){
  let out=null;
  try{ out=await callClaude(SYS_CONVERT,"Line type: "+type+"\nKnown characters: "+([...characters().keys()].join(", ")||"none")+"\nPrevious lines:\n"+recent(4)+"\n\nManglish typed: "+raw+"\nRough conversion: "+c.ml); }
  catch(e){ aiFailed(); }
  const b=script.blocks.find(x=>x.id===id); if(!b) return;
  b.pending=false;
  if(out){ out=out.replace(/^["“]|["”]$/g,"").trim(); b.text=type==="paren"&&!/^\(.*\)$/.test(out)?"("+out+")":out; autoLearn(c,out); }
  const d=document.querySelector('.blk[data-id="'+id+'"]');
  if(d){ d.textContent=b.text; d.classList.remove("pending"); d.contentEditable=true; } else render();
  renderSide(); save();
}
/* When AI fixes a guessed word, remember it so next time it is right instantly, even offline */
function autoLearn(c,out){
  const rw=c.parts.filter(p=>p.word);
  const mw=out.split(/\s+/).map(w=>w.replace(/^[^\u0D00-\u0D7FA-Za-z]+|[^\u0D00-\u0D7FA-Za-z]+$/g,"")).filter(Boolean);
  if(rw.length!==mw.length) return;
  rw.forEach((p,i)=>{ if(!p.cands.sure && p.raw===p.raw.toLowerCase() && /^[\u0D00-\u0D7F\u200C\u200D]+$/.test(mw[i]) && mw[i]!==p.ml) learn(p.raw,mw[i]); });
  saveSettings();
}
const SYS_FORMAT=`You format spoken Malayalam into screenplay elements. The writer dictates a film script; their words may describe action, a scene location, or a character speaking. Split the speech into elements.
Types: scene (location/time heading), action (what we see), character (speaker name only), paren (short delivery note), dialogue (spoken line), transition (e.g. CUT TO).
Cues: "X പറയുന്നു / പറഞ്ഞു / ചോദിക്കുന്നു" means X speaks the following words: emit character X then dialogue. Words like സീൻ / രംഗം start a scene heading. Words like ആക്ഷൻ mark action. Remove command words themselves. Fix obvious speech-recognition spelling errors and add punctuation. Spell character names as in the known list. Keep everything in Malayalam script.
Reply with ONLY a JSON array like [{"type":"action","text":"..."}]. No markdown.`;
const parseBlocks=raw=>{ const arr=JSON.parse(raw.replace(/```json|```/g,"").trim()); if(!Array.isArray(arr)) throw 0;
  return arr.filter(e=>e&&NEXT[e.type]&&e.text).map(e=>({id:uid(),type:e.type,text:e.type==="paren"&&!/^\(.*\)$/.test(e.text)?"("+e.text+")":String(e.text)})); };
async function formatSpeech(text){
  const ctx=recent(6), ph=addBlock(curType,text,true); render(); scrollToNew();
  try{
    const valid=parseBlocks(await callClaude(SYS_FORMAT,"Known characters: "+([...characters().keys()].join(", ")||"none")+"\nRecent script lines:\n"+ctx+"\n\nNew speech:\n"+text));
    if(!valid.length) throw 0;
    const i=script.blocks.indexOf(ph); if(i<0) return;
    script.blocks.splice(i,1,...valid);
    if(insertAfter===ph.id) insertAfter=valid[valid.length-1].id;
    curType=NEXT[valid[valid.length-1].type];
  }catch(e){
    const i=script.blocks.indexOf(ph);
    if(i>-1){ script.blocks.splice(i,1); if(insertAfter===ph.id) insertAfter=i>0?script.blocks[i-1].id:null; }
    voiceRules(text); aiFailed();
  }
  afterAdd();
}

/* AI writing tools */
let aiRes=null;
function openAi(){
  closeSheets(); const sel=selId&&script.blocks.find(b=>b.id===selId);
  $("aiTarget").textContent=sel?"Selected line: “"+sel.text.slice(0,80)+(sel.text.length>80?"…":"")+"”":"Tap a line in your script first to rewrite or translate it. The two buttons below work on the whole script.";
  $("aiActs").querySelectorAll("button").forEach(b=>b.disabled=!sel);
  $("aiOut").hidden=true; $("aiUse").hidden=true; aiRes=null; $("aiSheet").classList.add("open");
}
const AI_ASK={natural:"Rewrite it so it sounds like natural spoken Malayalam, the way real people talk.",short:"Make it shorter and punchier without losing the meaning.",
  emotional:"Make it more emotional and heartfelt.",funny:"Add a touch of natural Malayalam humour.",english:"Translate it into natural English, subtitle style."};
async function runAi(kind){
  const out=$("aiOut"); out.hidden=false; $("aiUse").hidden=true; out.textContent="Thinking…"; aiRes=null;
  const sel=selId&&script.blocks.find(b=>b.id===selId);
  try{
    if(kind==="next"){
      const blocks=parseBlocks(await callClaude("You are an experienced Malayalam screenwriter. Continue the screenplay with the next 3 to 5 elements that follow naturally, in Malayalam script, matching the tone and the characters' voices. Types allowed: scene, action, character, paren, dialogue, transition. Reply with ONLY a JSON array like [{\"type\":\"action\",\"text\":\"...\"}]. No markdown.",
        "Title: "+(script.title||"untitled")+"\nScript so far (most recent lines):\n"+recent(30)));
      if(!blocks.length) throw 0;
      aiRes={kind,blocks}; out.innerHTML=blocks.map(b=>'<span class="t">'+TYPES.find(t=>t[0]===b.type)[1]+"</span>"+esc(b.text)).join("\n");
      $("aiApply").textContent="Add to script"; $("aiApply").hidden=false;
    } else if(kind==="summary"){
      if(!script.blocks.length) throw new Error("Write a few lines first.");
      const t=await callClaude("You are a script editor. Write a one-sentence logline and a 3-4 sentence synopsis of this Malayalam screenplay. Give both in Malayalam first, then in English. Plain text, no markdown.",
        "Title: "+(script.title||"untitled")+"\n\n"+script.blocks.map(b=>b.type+": "+b.text).join("\n").slice(-12000));
      aiRes={kind,text:t}; out.textContent=t; $("aiApply").hidden=true;
    } else {
      if(!sel) throw new Error("Tap a line in your script first.");
      const t=await callClaude("You are an experienced Malayalam screenwriter helping polish a script. "+AI_ASK[kind]+(kind==="english"?"":" Keep it in Malayalam script and keep it a single screenplay "+sel.type+" line.")+" Output ONLY the result, no quotes or notes.",
        "Lines before it:\n"+script.blocks.slice(Math.max(0,script.blocks.indexOf(sel)-6),script.blocks.indexOf(sel)).map(b=>b.type+": "+b.text).join("\n")+"\n\nThe line ("+sel.type+"):\n"+sel.text);
      aiRes={kind,text:t,id:sel.id}; out.textContent=t; $("aiApply").textContent="Use this"; $("aiApply").hidden=kind==="english";
    }
    $("aiUse").hidden=false;
  }catch(e){ out.textContent=e&&e.message&&!/API|fetch|JSON/i.test(e.message)?e.message:"AI tools need the app to be open inside Claude. They aren't reachable from here right now."; }
}
$("aiActs").querySelectorAll("button").forEach(b=>b.onclick=()=>runAi(b.dataset.ai));
$("aiNext").onclick=()=>runAi("next"); $("aiSummary").onclick=()=>runAi("summary");
$("aiCopy").onclick=()=>{ if(aiRes) copyText(aiRes.text||aiRes.blocks.map(b=>b.text).join("\n")); toast("Copied"); };
$("aiApply").onclick=()=>{
  if(!aiRes) return; pushUndo();
  if(aiRes.kind==="next"){ const keep=insertAfter; if(selId) insertAfter=selId;
    aiRes.blocks.forEach(b=>addBlock(b.type,b.text)); if(selId) insertAfter=keep;
    if(!insertAfter) curType=NEXT[aiRes.blocks[aiRes.blocks.length-1].type]; }
  else { const b=script.blocks.find(x=>x.id===aiRes.id); if(b) b.text=aiRes.text; }
  closeSheets(); afterAdd(); toast("Added. Undo brings the old version back.");
};

/* ---------- Voice ---------- */
function voiceRules(t){
  t=t.trim(); let m;
  if((m=t.match(/^(സീൻ|സീന്|രംഗം|scene)\s*(.*)$/i))){ addBlock("scene",m[2]||t); curType="action"; }
  else if((m=t.match(/^(ആക്ഷൻ|ആക്ഷന്|action)\s*(.*)$/i))){ addBlock("action",m[2]); curType="action"; }
  else if((m=t.match(/^(ഡയലോഗ്|dialogue)\s*(.*)$/i))){ addBlock("dialogue",m[2]); curType="action"; }
  else if(/^(കട്ട്|cut to|ഫേഡ്|fade)/i.test(t)){ addBlock("transition",t); curType="scene"; }
  else if((m=t.match(/^(കഥാപാത്രം)\s*(.+)$/))){ addBlock("character",m[2]); curType="dialogue"; }
  else if((m=t.match(/^(\S+)\s+(പറയുന്നു|പറഞ്ഞു|ചോദിക്കുന്നു|ചോദിച്ചു|says)\s*(.*)$/i))){
    addBlock("character",m[1]); if(m[3]){ addBlock("dialogue",m[3]); curType="action"; } else curType="dialogue"; }
  else { addBlock(curType,t); curType=NEXT[curType]; }
}
function onSpeech(t){ pushUndo(); if(!NATIVE&&settings.ai&&aiOK) formatSpeech(t); else { voiceRules(t); afterAdd(); } }
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function setMic(on){ listening=on; $("mic").classList.toggle("on",on); $("mic").setAttribute("aria-label",on?"Stop voice typing":"Start voice typing");
  if(on){ $("cands").innerHTML=""; $("preview").className="listening"; $("preview").textContent="Listening… speak in Malayalam"; } else updateComposer(); }
window.__thkVoice=(type,text)=>{
  if(type==="partial"){ if(listening){ $("preview").className="listening"; $("preview").textContent=text||"Listening… speak in Malayalam"; } }
  else if(type==="final"){ if(text&&text.trim()) onSpeech(text.trim()); if(listening){ $("preview").className="listening"; $("preview").textContent="Listening… speak in Malayalam"; } }
  else if(type==="error"){ setMic(false);
    toast(text==="permission"?"Allow microphone access to use voice typing.":text==="network"?"Voice typing needs an internet connection.":text==="language"?"Malayalam voice typing isn't installed. Add Malayalam in the Google app's voice settings.":text==="unavailable"?"Voice typing needs the Google app on this phone.":"Voice typing stopped. Tap the mic to try again."); }
};
function startVoice(){
  if(NATIVE){ NATIVE.startVoice(); setMic(true); clearSel(); return; }
  if(!SR){ toast("Voice typing isn't supported in this browser. Open the app in Chrome."); return; }
  rec=new SR(); rec.lang="ml-IN"; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i], t=r[0].transcript.trim();
      if(r.isFinal){ if(t) onSpeech(t); }
      else interim+=t+" ";
    }
    $("preview").className="listening"; $("preview").textContent=interim.trim()||"Listening… speak in Malayalam";
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ toast("Microphone is blocked. Allow mic access, or open the app in Chrome."); setMic(false); }
    else if(e.error==="language-not-supported"){ toast("Malayalam voice isn't available in this browser. Try Chrome."); setMic(false); }
  };
  rec.onend=()=>{ if(listening){ try{ rec.start(); }catch(_){ setMic(false); } } };
  try{ rec.start(); setMic(true); clearSel(); }catch(e){ toast("Couldn't start the microphone."); }
}
$("mic").onclick=()=>{ if(listening){ listening=false; if(NATIVE) NATIVE.stopVoice(); else try{ rec.stop(); }catch(_){} setMic(false); } else startVoice(); };

/* ---------- Read aloud ---------- */
let reading=false;
let ttsNext=null;
window.__thkTts=ev=>{ if(ev==="done"){ const f=ttsNext; ttsNext=null; if(f) f(); }
  else { stopReading(); toast(ev==="language"?"No Malayalam voice on this phone. Install one in Settings → Text-to-speech.":"Couldn't read aloud on this phone."); } };
function stopReading(){ reading=false; ttsNext=null; try{ if(NATIVE) NATIVE.stopSpeak(); else speechSynthesis.cancel(); }catch(e){} document.querySelectorAll(".blk.reading").forEach(x=>x.classList.remove("reading")); $("readBtn").firstChild.textContent="Read script aloud"; }
function readAloud(){
  closeSheets();
  if(reading){ stopReading(); return; }
  if(!NATIVE&&!("speechSynthesis" in window)){ toast("This browser can't read aloud."); return; }
  const voices=NATIVE?[]:speechSynthesis.getVoices(), voice=voices.find(v=>/^ml/i.test(v.lang));
  if(voices.length&&!voice){ toast("No Malayalam voice on this device. Add one in your phone or Windows speech settings."); return; }
  let i=selId?Math.max(0,script.blocks.findIndex(b=>b.id===selId)):0;
  if(!script.blocks.length) return;
  reading=true; $("readBtn").firstChild.textContent="Stop reading"; toast("Reading aloud. Open Tools to stop.");
  const next=()=>{
    document.querySelectorAll(".blk.reading").forEach(x=>x.classList.remove("reading"));
    while(i<script.blocks.length&&(script.blocks[i].type==="paren"||!script.blocks[i].text.trim())) i++;
    if(!reading||i>=script.blocks.length){ stopReading(); return; }
    const b=script.blocks[i++], d=document.querySelector('.blk[data-id="'+b.id+'"]');
    if(d){ d.classList.add("reading"); d.scrollIntoView({block:"center",behavior:"smooth"}); }
    if(NATIVE){ ttsNext=next; NATIVE.speak(b.text); return; }
    const u=new SpeechSynthesisUtterance(b.text); u.lang="ml-IN"; if(voice) u.voice=voice; u.rate=.95;
    u.onend=next; u.onerror=()=>stopReading(); speechSynthesis.speak(u);
  };
  next();
}
$("readBtn").onclick=readAloud;
if("speechSynthesis" in window) speechSynthesis.getVoices();

/* ---------- Find and replace ---------- */
let findPos=-1;
const toMl=v=>/[A-Za-z]/.test(v)&&!/[\u0D00-\u0D7F]/.test(v)?translit(v):v;
function findNext(){
  const rawQ=$("findInp").value.trim(); document.querySelectorAll(".blk.hit").forEach(x=>x.classList.remove("hit"));
  if(!rawQ){ $("findInfo").textContent=""; return; }
  const term=toMl(rawQ);
  const hits=script.blocks.map((b,i)=>b.text.includes(term)||b.text.toLowerCase().includes(rawQ.toLowerCase())?i:-1).filter(i=>i>-1);
  if(!hits.length){ $("findInfo").textContent="No lines contain “"+term+"”"; findPos=-1; return; }
  const nxt=hits.find(i=>i>findPos); findPos=nxt===undefined?hits[0]:nxt;
  const d=document.querySelector('.blk[data-id="'+script.blocks[findPos].id+'"]');
  if(d){ d.classList.add("hit"); d.scrollIntoView({block:"center",behavior:"smooth"}); }
  $("findInfo").textContent="“"+term+"” is in "+hits.length+" line"+(hits.length===1?"":"s")+" · showing "+(hits.indexOf(findPos)+1)+" of "+hits.length;
}
$("findNext").onclick=findNext;
$("findInp").addEventListener("keydown",e=>{ if(e.key==="Enter") findNext(); });
$("findInp").addEventListener("input",()=>{ findPos=-1; });
$("replAll").onclick=()=>{
  const rawQ=$("findInp").value.trim(); if(!rawQ) return;
  const term=toMl(rawQ), rep=toMl($("replInp").value); let n=0; const before=snap();
  script.blocks.forEach(b=>{ const parts=b.text.split(term); if(parts.length>1){ n+=parts.length-1; b.text=parts.join(rep); } });
  if(n){ pushUndo(before); render(); save(); }
  $("findInfo").textContent=n?"Replaced "+n+" time"+(n===1?"":"s")+". Undo brings them back.":"Nothing to replace for “"+term+"”";
};
function openFind(){ closeSheets(); $("findBar").hidden=false; $("findInp").focus(); }
$("findBtn").onclick=openFind;
$("findClose").onclick=()=>{ $("findBar").hidden=true; document.querySelectorAll(".blk.hit").forEach(x=>x.classList.remove("hit")); };

/* ---------- Statistics ---------- */
function stats(){
  const b=script.blocks; let lines=0, words=0, cur=null; const per=new Map();
  const W={scene:55,action:55,character:30,paren:25,dialogue:32,transition:55}, GAP={scene:2,action:1,character:1,transition:2};
  b.forEach(x=>{
    const t=x.text.trim(), wc=t?t.split(/\s+/).length:0; words+=wc;
    lines+=Math.max(1,Math.ceil(x.text.length/W[x.type]))+(GAP[x.type]||0);
    if(x.type==="character"){ cur=t.replace(/\s*\(.*\)\s*$/,""); if(cur&&!per.has(cur)) per.set(cur,{n:0,w:0}); }
    else if(x.type==="dialogue"&&cur&&per.has(cur)){ per.get(cur).n++; per.get(cur).w+=wc; }
    else if(x.type==="scene"||x.type==="action"||x.type==="transition") cur=null;
  });
  const pages=b.length?Math.max(1,Math.round(lines/52*10)/10):0;
  return {pages,words,scenes:b.filter(x=>x.type==="scene").length,dialogues:b.filter(x=>x.type==="dialogue").length,per};
}
$("statsBtn").onclick=()=>{
  closeSheets(); const s=stats(), max=Math.max(1,...[...s.per.values()].map(v=>v.w));
  $("statsBody").innerHTML='<div class="stats"><div><b>'+s.scenes+'</b><span>scenes</span></div><div><b>'+s.pages+'</b><span>pages (approx.)</span></div><div><b>'+Math.round(s.pages)+' min</b><span>screen time (approx.)</span></div>'+
    '<div><b>'+s.words+'</b><span>words</span></div><div><b>'+s.dialogues+'</b><span>dialogue lines</span></div><div><b>'+s.per.size+'</b><span>speaking characters</span></div></div>'+
    (s.per.size?"<h3>Who speaks the most</h3>"+[...s.per].sort((a,b)=>b[1].w-a[1].w).map(([n,v])=>'<div style="margin:8px 0"><span style="font-family:var(--script)">'+esc(n)+'</span> <small style="color:var(--muted)">'+v.n+' lines, '+v.w+' words</small><div class="bar" style="width:'+Math.max(4,v.w/max*100)+'%"></div></div>').join(""):'<p class="note">Add dialogue to see how lines are shared between characters.</p>')+
    '<p class="note">Page and time figures are estimates: one page is about one minute on screen.</p>';
  $("statsSheet").classList.add("open");
};

/* ---------- View ---------- */
function applyView(){
  const r=document.documentElement;
  if(settings.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",settings.theme);
  r.style.setProperty("--fs",settings.fs+"rem");
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===settings.theme));
  document.querySelectorAll("[data-layout]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.layout===settings.layout));
}
document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>{ settings.theme=b.dataset.themeSet; applyView(); saveSettings(); });
document.querySelectorAll("[data-layout]").forEach(b=>b.onclick=()=>{ settings.layout=b.dataset.layout; applyView(); render(); saveSettings(); });
$("fsDown").onclick=()=>{ settings.fs=Math.max(.85,+(settings.fs-.05).toFixed(2)); applyView(); saveSettings(); };
$("fsUp").onclick=()=>{ settings.fs=Math.min(1.4,+(settings.fs+.05).toFixed(2)); applyView(); saveSettings(); };

/* ---------- Library ---------- */
async function openLib(){
  closeSheets(); await flush(); const box=$("libList"); box.innerHTML="";
  if(!index.length) box.appendChild(el("p","note","Scripts you write are kept here automatically."));
  [...index].sort((a,b)=>b.updated-a.updated).forEach(m=>{
    const row=el("div","lrow"), open=el("button"), del=el("button","chip danger","Delete");
    open.innerHTML=esc(m.title)+(m.id===script.id?" · open now":"")+"<small>Edited "+new Date(m.updated).toLocaleString()+"</small>";
    open.onclick=async()=>{ if(m.id===script.id){ closeSheets(); return; }
      const v=await store.get("thk:s:"+m.id); if(!v){ toast("Couldn't open that script"); return; }
      openScript(Object.assign(newScript(),JSON.parse(v))); closeSheets(); };
    let armed=false;
    del.onclick=async()=>{ if(!armed){ armed=true; del.textContent="Tap again to delete"; setTimeout(()=>{ armed=false; del.textContent="Delete"; },3000); return; }
      index=index.filter(x=>x.id!==m.id); await store.del("thk:s:"+m.id); await store.set("thk:index",JSON.stringify(index));
      if(m.id===script.id) openScript(newScript()); openLib(); };
    row.append(open,del); box.appendChild(row);
  });
  $("libSheet").classList.add("open");
}
$("libBtn").onclick=openLib;
$("newBtn").onclick=async()=>{ await flush(); openScript(newScript()); closeSheets(); toast("New script started. Your other scripts are in My scripts."); };

/* ---------- Export ---------- */
function asText(){
  let n=0, L=[]; if(script.title) L.push(script.title); if(script.author) L.push("Written by "+script.author); if(L.length) L.push("");
  script.blocks.forEach(b=>{ const t=b.text.trim(); if(!t) return;
    switch(b.type){
      case "scene": n++; L.push("",n+". "+t,""); break;
      case "action": L.push(t,""); break;
      case "character": L.push(" ".repeat(22)+t); break;
      case "paren": L.push(" ".repeat(16)+t); break;
      case "dialogue": L.push(" ".repeat(10)+t,""); break;
      case "transition": L.push(" ".repeat(40)+t,""); break;
    } });
  return L.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
}
function asFountain(){
  const L=[]; if(script.title) L.push("Title: "+script.title); if(script.author) L.push("Author: "+script.author); if(script.contact) L.push("Contact: "+script.contact); if(L.length) L.push("");
  script.blocks.forEach(b=>{ const t=b.text.trim(); if(!t) return;
    switch(b.type){
      case "scene": L.push("","."+t,""); break;
      case "action": L.push(t,""); break;
      case "character": L.push("","@"+t); break;
      case "paren": L.push(t); break;
      case "dialogue": L.push(t); break;
      case "transition": L.push("","> "+t,""); break;
    } });
  return L.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
}
function asDoc(){
  const st={scene:"font-weight:bold;margin-top:18pt",action:"margin-top:8pt",character:"margin:12pt 0 0 2.2in;font-weight:bold",
    paren:"margin-left:1.6in",dialogue:"margin:0 1in 0 1in",transition:"text-align:right;margin-top:12pt;font-weight:bold"};
  let n=0;
  const body=script.blocks.filter(b=>b.text.trim()).map(b=>'<p style="'+st[b.type]+';margin-bottom:0">'+esc((b.type==="scene"?(++n)+". ":"")+b.text)+"</p>").join("\n");
  const tp=script.title?'<h1 style="text-align:center;margin-top:2.5in">'+esc(script.title)+"</h1>"+(script.author?'<p style="text-align:center">Written by<br><b>'+esc(script.author)+"</b></p>":"")+(script.contact?'<p style="text-align:center">'+esc(script.contact)+"</p>":"")+'<br clear="all" style="page-break-before:always">':"";
  return '<html><head><meta charset="utf-8"><title>'+esc(script.title||"Script")+'</title><style>body{font-family:"Noto Serif Malayalam","Nirmala UI","Kartika",serif;font-size:12pt;line-height:1.6}</style></head><body>'+tp+body+"</body></html>";
}
let fmt="script";
const FMT_NOTES={script:"Keeps every line type, so you can open it here later and keep editing.",
  doc:"Opens in Microsoft Word and Google Docs with the screenplay layout and a title page. Saved to Drive, it becomes a Google Doc.",
  fountain:"The standard screenplay text format. Opens in screenwriting apps such as Fade In, Highland and WriterDuet.",
  txt:"Plain text with spacing for the layout. Opens anywhere."};
function buildFile(){
  const base=(script.title||"script").replace(/[\\/:*?"<>|]/g,"").trim()||"script";
  if(fmt==="script") return {name:base+".mlscript",type:"application/json",
    data:JSON.stringify({app:"thirakkatha",version:2,savedAt:new Date().toISOString(),script:{title:script.title,author:script.author,contact:script.contact,blocks:script.blocks.map(({type,text})=>({type,text}))}},null,1)};
  if(fmt==="doc") return {name:base+".doc",type:"application/msword",data:"\ufeff"+asDoc()};
  if(fmt==="fountain") return {name:base+".fountain",type:"text/plain",data:asFountain()};
  return {name:base+".txt",type:"text/plain",data:"\ufeff"+asText()};
}
window.__thkSaved=(ok,name,cancelled)=>{ if(ok) toast("Saved "+name); else if(!cancelled) toast("Couldn't save the file. Try another folder."); };
function download(f){
  if(NATIVE){ const ext=f.name.slice(f.name.lastIndexOf(".")+1);
    NATIVE.saveFile(f.name,ext==="txt"?"text/plain":ext==="doc"?"application/msword":"application/octet-stream",f.data); return; }
  const url=URL.createObjectURL(new Blob([f.data],{type:f.type}));
  const a=el("a"); a.href=url; a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=el("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
}
$("copyBtn").onclick=async()=>{ await copyText(asText()); closeSheets(); toast("Script copied"); };
$("printBtn").onclick=()=>{ closeSheets(); clearSel(); setTimeout(()=>{ if(NATIVE) NATIVE.print(script.title||""); else window.print(); },200); };
$("saveDevice").onclick=async()=>{
  if(!script.blocks.length){ toast("Write something first, then save"); return; }
  const f=buildFile();
  if(NATIVE){ closeSheets(); download(f); return; }
  if(window.showSaveFilePicker){
    try{
      const ext=f.name.slice(f.name.lastIndexOf("."));
      const h=await showSaveFilePicker({suggestedName:f.name,types:[{description:"Script",accept:{[f.type]:[ext]}}]});
      const w=await h.createWritable(); await w.write(new Blob([f.data],{type:f.type})); await w.close();
      closeSheets(); toast("Saved "+f.name); return;
    }catch(e){ if(e.name==="AbortError") return; }
  }
  try{ download(f); closeSheets(); toast("Saved "+f.name+" to your downloads"); }
  catch(e){ toast("This window can't save files. Open the app in Chrome to save."); }
};
function loadScriptData(d,name){
  const s=d&&(d.script||d); if(!s||!Array.isArray(s.blocks)) throw new Error("bad");
  const n=newScript(); n.title=s.title||""; n.author=s.author||""; n.contact=s.contact||"";
  n.blocks=s.blocks.filter(b=>b&&NEXT[b.type]).map(b=>({id:uid(),type:b.type,text:String(b.text||"")}));
  openScript(n); save(); closeSheets(); toast("Opened "+name); return n;
}
$("openBtn").onclick=()=>$("openFile").click();
$("openFile").onchange=async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{ const d=JSON.parse(await file.text()); await flush(); loadScriptData(d,file.name); }
  catch(err){ toast("That isn't a script file. Choose a .mlscript file saved from this app."); }
};
function setFmt(v){ fmt=v; document.querySelectorAll("#fmtRow .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.fmt===v)); $("fmtNote").textContent=FMT_NOTES[v]; }
document.querySelectorAll("#fmtRow .chip").forEach(c=>c.onclick=()=>setFmt(c.dataset.fmt)); setFmt("script");

/* ---------- Google Drive ---------- */
let gClientId="", gToken=null, gTokenExp=0, gFolderId=null;
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.file", FOLDER_NAME="Thirakkatha Scripts";
const hostedOk=()=>location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
function updateDriveUI(){
  if(NATIVE){ $("driveSetup").hidden=true; $("driveDisconnect").hidden=true; $("openDrive").hidden=true;
    $("driveStatus").textContent="Tap Save to Google Drive, then open the ☰ menu in the save screen and choose Drive. To open a script from Drive, use Open script file and pick Drive the same way."; return; }
  const on=!!gClientId;
  $("driveSetup").hidden=on; $("driveDisconnect").hidden=!on; $("openDrive").hidden=!on;
  $("driveStatus").textContent=on
    ?(gToken&&Date.now()<gTokenExp?"Connected. Scripts save into the “"+FOLDER_NAME+"” folder in your Drive.":"Ready. You'll be asked to sign in to Google the first time you save or open.")
    :"Not connected. Save to Google Drive uses your phone's share sheet. To save straight into a Drive folder, paste your Google Client ID below.";
}
function loadGis(){ return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2) return res();
  const s=el("script"); s.src="https://accounts.google.com/gsi/client"; s.onload=()=>res(); s.onerror=()=>rej(new Error("Couldn't load Google sign-in")); document.head.appendChild(s); }); }
async function getToken(){
  if(gToken&&Date.now()<gTokenExp-60000) return gToken;
  if(!hostedOk()) throw new Error("Google sign-in needs the app on a website (https). Open it from your hosted link.");
  await loadGis();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:gClientId,scope:DRIVE_SCOPE,
      callback:r=>{ if(r.error) return rej(new Error("Google sign-in was cancelled"));
        gToken=r.access_token; gTokenExp=Date.now()+(r.expires_in||3600)*1000; updateDriveUI(); res(gToken); },
      error_callback:e=>rej(new Error(e.type==="popup_closed"?"Google sign-in was closed":"Google sign-in failed. Check your Client ID and authorized origin."))});
    tc.requestAccessToken({prompt:gToken?"":"consent"});
  });
}
async function gfetch(url,opt={}){
  const t=await getToken();
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+t}});
  if(r.status===401){ gToken=null; throw new Error("Google sign-in expired. Try again."); }
  return r;
}
async function ensureFolder(){
  if(gFolderId) return gFolderId;
  const q=encodeURIComponent("name='"+FOLDER_NAME+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const r=await (await gfetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id)")).json();
  if(r.files&&r.files.length) return gFolderId=r.files[0].id;
  const c=await (await gfetch("https://www.googleapis.com/drive/v3/files",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:FOLDER_NAME,mimeType:"application/vnd.google-apps.folder"})})).json();
  if(!c.id) throw new Error("Couldn't create the Drive folder");
  return gFolderId=c.id;
}
function multipart(meta,type,data){ const b="thk"+uid();
  return {boundary:b,body:"--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)+"\r\n--"+b+"\r\nContent-Type: "+type+"; charset=UTF-8\r\n\r\n"+data+"\r\n--"+b+"--"}; }
async function driveUpload(){
  const f=buildFile(), ids=script.driveIds||(script.driveIds={}), asGDoc=fmt==="doc";
  const name=asGDoc?f.name.replace(/\.doc$/,""):f.name, type=asGDoc?"text/html":(fmt==="script"?"application/json":"text/plain");
  const data=asGDoc?asDoc():f.data.replace(/^\ufeff/,"");
  const send=async id=>{
    const meta=id?{name}:{name,parents:[await ensureFolder()],...(asGDoc?{mimeType:"application/vnd.google-apps.document"}:{})};
    const mp=multipart(meta,type,data);
    return gfetch(id?"https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=multipart&fields=id,name":"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
      {method:id?"PATCH":"POST",headers:{"Content-Type":"multipart/related; boundary="+mp.boundary},body:mp.body});
  };
  let r=await send(ids[fmt]);
  if(ids[fmt]&&(r.status===404||r.status===403)){ delete ids[fmt]; r=await send(null); }
  if(!r.ok) throw new Error("Drive didn't accept the file ("+r.status+")");
  const j=await r.json(); ids[fmt]=j.id; save(); return j.name;
}
$("openDrive").onclick=async()=>{
  const box=$("driveList"); box.innerHTML='<p class="note">Loading your scripts from Drive…</p>';
  try{
    const q=encodeURIComponent("name contains '.mlscript' and trashed=false");
    const r=await (await gfetch("https://www.googleapis.com/drive/v3/files?q="+q+"&orderBy=modifiedTime desc&pageSize=30&fields=files(id,name,modifiedTime)")).json();
    const files=r.files||[];
    if(!files.length){ box.innerHTML='<p class="note">No script files in Drive yet. Save one as “Script file” first.</p>'; return; }
    box.innerHTML="";
    files.forEach(fl=>{ const b=el("button");
      b.innerHTML=esc(fl.name.replace(/\.mlscript$/,""))+"<small>Edited "+new Date(fl.modifiedTime).toLocaleString()+"</small>";
      b.onclick=async()=>{ try{
          const res=await gfetch("https://www.googleapis.com/drive/v3/files/"+fl.id+"?alt=media"); if(!res.ok) throw 0;
          const d=JSON.parse(await res.text()); await flush(); const n=loadScriptData(d,fl.name); n.driveIds={script:fl.id}; save(); box.innerHTML="";
        }catch(e){ toast("Couldn't open "+fl.name); } };
      box.appendChild(b); });
  }catch(e){ box.innerHTML=""; toast(e.message); }
};
$("clientIdSave").onclick=async()=>{
  const v=$("clientIdInp").value.trim();
  if(!/\.apps\.googleusercontent\.com$/.test(v)){ toast("That doesn't look like a Client ID. It ends in .apps.googleusercontent.com"); return; }
  gClientId=settings.gclient=v; saveSettings(); updateDriveUI();
  try{ await getToken(); toast("Google Drive connected"); }catch(e){ toast(e.message); }
};
$("driveDisconnect").onclick=()=>{
  try{ if(gToken&&window.google) google.accounts.oauth2.revoke(gToken,()=>{}); }catch(e){}
  gToken=null; gFolderId=null; gClientId=settings.gclient=""; saveSettings(); updateDriveUI(); toast("Google Drive disconnected");
};
async function shareToDrive(){
  const f=buildFile();
  try{ const file=new File([f.data],f.name,{type:f.type==="application/json"?"text/plain":f.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:f.name}); closeSheets(); toast("Pick Drive in the share list to save there"); return; }
  }catch(e){ if(e.name==="AbortError") return; }
  try{ download(f); }catch(e){}
  window.open("https://drive.google.com/drive/my-drive","_blank");
  closeSheets(); toast("File saved. In Drive, tap New → File upload and choose "+f.name);
}
$("saveDrive").onclick=async()=>{
  if(!script.blocks.length){ toast("Write something first, then save"); return; }
  if(NATIVE){ closeSheets(); download(buildFile()); return; }
  if(!gClientId){ shareToDrive(); return; }
  const btn=$("saveDrive"), lab=btn.querySelector("span"); btn.disabled=true; lab.textContent="Saving to Drive…";
  try{ const n=await driveUpload(); closeSheets(); toast("Saved “"+n+"” to Google Drive"); }
  catch(e){ toast(e.message||"Couldn't save to Drive"); }
  finally{ btn.disabled=false; lab.textContent="Save to Google Drive"; }
};

/* ---------- Sheets, drawer, toast, shortcuts ---------- */
function closeSheets(){ document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("open")); }
const openSheet=id=>{ closeSheets(); $(id).classList.add("open"); };
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{ if(e.target===s||e.target.hasAttribute("data-close")) closeSheets(); }));
$("menuBtn").onclick=()=>openSheet("menuSheet");
$("saveBtn").onclick=()=>openSheet("saveSheet");
$("helpBtn").onclick=()=>openSheet("helpSheet");
$("detailsBtn").onclick=()=>openSheet("detailsSheet");
$("aiBtn").onclick=openAi;
const closeSide=()=>$("app").classList.remove("sideopen");
$("sideBtn").onclick=()=>$("app").classList.toggle("sideopen");
$("scrim").onclick=closeSide;
let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200); }
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeSheets(); closeSide(); return; }
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase(), a=document.activeElement, typing=a&&(a.isContentEditable||((a.tagName==="TEXTAREA"||a.tagName==="INPUT")&&a.value));
  if(k==="s"){ e.preventDefault(); openSheet("saveSheet"); }
  else if(k==="f"){ e.preventDefault(); openFind(); }
  else if(k==="z"&&!typing){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if(k==="y"&&!typing){ e.preventDefault(); redo(); }
  else if(/^[1-6]$/.test(k)){ e.preventDefault(); curType=TYPES[+k-1][0]; renderChips(); updateComposer(); }
});
window.addEventListener("beforeunload",()=>{ flush(); });
window.__thkFlush=()=>{ flush(); };
window.__thkBack=()=>{                      // Android back button: close whatever is open first
  if(document.querySelector(".sheet.open")){ closeSheets(); return true; }
  if($("app").classList.contains("sideopen")){ closeSide(); return true; }
  if(!$("findBar").hidden){ $("findClose").click(); return true; }
  if(selId){ document.activeElement&&document.activeElement.blur(); clearSel(); return true; }
  return false;
};

const KEYS=[["A","ആ"],["I","ഈ"],["U","ഊ"],["E","ഏ"],["O","ഓ"],["T","ട"],["D","ഡ"],["N","ണ"],["L","ള"],["R","റ"],["S","ഷ"],["Th","ഠ"],["Dh","ഢ"],["zh","ഴ"],["ksh","ക്ഷ"],["~","്"]];
$("keyGrid").innerHTML=KEYS.map(([k,v])=>"<span><b>"+k+"</b>"+v+"</span>").join("");

/* ---------- Installable app ---------- */
if(NATIVE){ $("aiTog").hidden=true; $("aiBtn").hidden=true; }
if(!NATIVE && "serviceWorker" in navigator && hostedOk()) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
let installEvt=null;
const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; $("installBtn").hidden=false; });
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone&&location.protocol==="https:") $("installBtn").hidden=false;
$("installBtn").onclick=async()=>{
  closeSheets();
