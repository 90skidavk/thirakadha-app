name: Build Android APK

on:
  push:name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Thirakkatha.apk

      - name: Attach APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: Thirakkatha-APK
          path: Thirakkatha.apk

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: Thirakkatha APK
          body: Download Thirakkatha.apk below and open it on your Android phone to install.
          files: Thirakkatha.apk
          make_latest: true

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thirakkatha.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thirakkatha.app'
        minSdk 24
        targetSdk 34
        // Raise versionCode by 1 every time you publish an update
        versionCode 1
        versionName '1.0'
    }

    // A fixed signing key, so every new build installs over the old one without losing your scripts.
    // For the Play Store, replace this with your own private key.
    signingConfigs {
        fixed {
            storeFile file('thirakkatha.keystore')
            storePassword 'thirakkatha'
            keyAlias 'thirakkatha'
            keyPassword 'thirakkatha'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

package com.thirakkatha.app;

import android.Manifest;
import android.app.Activity;
import android.content.ActivityNotFoundException;
import android.content.Context;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.net.Uri;
import android.os.Bundle;
import android.print.PrintAttributes;
import android.print.PrintManager;
import android.speech.RecognitionListener;
import android.speech.RecognizerIntent;
import android.speech.SpeechRecognizer;
import android.speech.tts.TextToSpeech;
import android.speech.tts.UtteranceProgressListener;
import android.webkit.JavascriptInterface;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebResourceResponse;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

import org.json.JSONObject;

import java.io.ByteArrayInputStream;
import java.io.IOException;
import java.io.InputStream;
import java.io.OutputStream;
import java.nio.charset.StandardCharsets;
import java.util.ArrayList;
import java.util.HashMap;
import java.util.Locale;

/**
 * Thirakkatha for Android.
 * The whole app is the web page in assets/www. This activity shows it and gives it
 * the phone features a web page can't reach on its own: voice typing, saving and
 * opening files, printing, and reading aloud.
 */
public class MainActivity extends Activity {

    private static final String HOST = "app.thirakkatha.local";
    private static final String START_URL = "https://" + HOST + "/index.html";
    private static final int REQ_MIC = 1;
    private static final int REQ_SAVE = 2;
    private static final int REQ_OPEN = 3;

    private WebView web;

    private SpeechRecognizer recognizer;
    private boolean listening = false;
    private int quietRounds = 0;

    private TextToSpeech tts;
    private boolean ttsReady = false;
    private String pendingSpeech = null;

    private String pendingSaveText = null;
    private String pendingSaveName = "";
    private ValueCallback<Uri[]> fileCallback = null;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        web = new WebView(this);
        setContentView(web);

        WebSettings s = web.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setDatabaseEnabled(true);
        s.setTextZoom(100);
        s.setMediaPlaybackRequiresUserGesture(false);

        web.addJavascriptInterface(new Bridge(), "ThkNative");

        web.setWebViewClient(new WebViewClient() {
            @Override
            public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                Uri u = request.getUrl();
                if (!HOST.equals(u.getHost())) return null;
                String path = u.getPath();
                if (path == null || path.equals("/") || path.isEmpty()) path = "/index.html";
                try {
                    InputStream in = getAssets().open("www" + path);
                    String mime = mimeFor(path);
                    String enc = mime.startsWith("image/") ? null : "UTF-8";
                    return new WebResourceResponse(mime, enc, in);
                } catch (IOException e) {
                    return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found",
                            new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                }
            }

            @Override
            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                Uri u = request.getUrl();
                if (HOST.equals(u.getHost())) return false;
                try {
                    startActivity(new Intent(Intent.ACTION_VIEW, u));
                } catch (ActivityNotFoundException ignored) {
                }
                return true;
            }
        });

        web.setWebChromeClient(new WebChromeClient() {
            @Override
            public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                             FileChooserParams params) {
                if (fileCallback != null) fileCallback.onReceiveValue(null);
                fileCallback = callback;
                Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                i.addCategory(Intent.CATEGORY_OPENABLE);
                i.setType("*/*");
                try {
                    startActivityForResult(i, REQ_OPEN);
                } catch (ActivityNotFoundException e) {
                    fileCallback = null;
                    return false;
                }
                return true;
            }
        });

        if (savedInstanceState != null) {
            web.restoreState(savedInstanceState);
        } else {
            web.loadUrl(START_URL);
        }
    }

    private static String mimeFor(String path) {
        String p = path.toLowerCase(Locale.ROOT);
        if (p.endsWith(".html")) return "text/html";
        if (p.endsWith(".js")) return "application/javascript";
        if (p.endsWith(".css")) return "text/css";
        if (p.endsWith(".png")) return "image/png";
        if (p.endsWith(".svg")) return "image/svg+xml";
        if (p.endsWith(".json") || p.endsWith(".webmanifest")) return "application/json";
        return "application/octet-stream";
    }

    /** Run a line of JavaScript in the page. */
    private void js(final String code) {
        web.post(new Runnable() {
            @Override
            public void run() {
                web.evaluateJavascript(code, null);
            }
        });
    }

    private void voiceEvent(String type, String text) {
        js("window.__thkVoice&&window.__thkVoice(" + JSONObject.quote(type) + "," + JSONObject.quote(text == null ? "" : text) + ")");
    }

    private void ttsEvent(String type) {
        js("window.__thkTts&&window.__thkTts(" + JSONObject.quote(type) + ")");
    }

    // ------------------------------------------------------------------ voice typing

    private void beginVoice() {
        if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
            requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
            return;
        }
        if (!SpeechRecognizer.isRecognitionAvailable(this)) {
            voiceEvent("error", "unavailable");
            return;
        }
        if (recognizer == null) {
            recognizer = SpeechRecognizer.createSpeechRecognizer(this);
            recognizer.setRecognitionListener(voiceListener);
        }
        listening = true;
        quietRounds = 0;
        listenOnce();
    }

    private void listenOnce() {
        Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
        i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
        i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ml-IN");
        i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "ml-IN");
        i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
        i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
        i.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, getPackageName());
        try {
            recognizer.startListening(i);
        } catch (Exception e) {
            listening = false;
            voiceEvent("error", "other");
        }
    }

    private void listenAgainSoon() {
        web.postDelayed(new Runnable() {
            @Override
            public void run() {
                if (listening) listenOnce();
            }
        }, 250);
    }

    private void endVoice() {
        listening = false;
        if (recognizer != null) {
            try {
                recognizer.cancel();
            } catch (Exception ignored) {
            }
        }
    }

    private static String firstResult(Bundle b) {
        if (b == null) return "";
        ArrayList<String> list = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
        return (list == null || list.isEmpty() || list.get(0) == null) ? "" : list.get(0);
    }

    private final RecognitionListener voiceListener = new RecognitionListener() {
        @Override
        public void onReadyForSpeech(Bundle params) {
        }

        @Override
        public void onBeginningOfSpeech() {
        }

        @Override
        public void onRmsChanged(float rmsdB) {
        }

        @Override
        public void onBufferReceived(byte[] buffer) {
        }

        @Override
        public void onEndOfSpeech() {
        }

        @Override
        public void onEvent(int eventType, Bundle params) {
        }

        @Override
        public void onPartialResults(Bundle partialResults) {
            if (listening) voiceEvent("partial", firstResult(partialResults));
        }

        @Override
        public void onResults(Bundle results) {
            String text = firstResult(results);
            if (!text.isEmpty()) {
                quietRounds = 0;
                voiceEvent("final", text);
            }
            if (listening) listenAgainSoon();
        }

        @Override
        public void onError(int error) {
            if (!listening) return;
            switch (error) {
                case SpeechRecognizer.ERROR_NO_MATCH:
                case SpeechRecognizer.ERROR_SPEECH_TIMEOUT:
                case SpeechRecognizer.ERROR_CLIENT:
                    // silence: keep listening, but give up after a long quiet spell
                    if (++quietRounds > 12) {
                        listening = false;
                        voiceEvent("error", "other");
                    } else {
                        listenAgainSoon();
                    }
                    break;
                case SpeechRecognizer.ERROR_RECOGNIZER_BUSY:
                    try {
                        recognizer.cancel();
                    } catch (Exception ignored) {
                    }
                    listenAgainSoon();
                    break;
                case SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS:
                    listening = false;
                    voiceEvent("error", "permission");
                    break;
                case SpeechRecognizer.ERROR_NETWORK:
                case SpeechRecognizer.ERROR_NETWORK_TIMEOUT:
                case SpeechRecognizer.ERROR_SERVER:
                    listening = false;
                    voiceEvent("error", "network");
                    break;
                case 12:    // language not supported
                case 13:    // language unavailable
                    listening = false;
                    voiceEvent("error", "language");
                    break;
                default:
                    listening = false;
                    voiceEvent("error", "other");
            }
        }
    };

    @Override
    public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
        super.onRequestPermissionsResult(requestCode, permissions, grantResults);
        if (requestCode != REQ_MIC) return;
        if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
            beginVoice();
        } else {
            voiceEvent("error", "permission");
        }
    }

    // ------------------------------------------------------------------ read aloud

    private void speakNow(String text) {
        if (tts == null || !ttsReady) {
            ttsEvent("error");
            return;
        }
        tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "thk");
    }

    private void speak(final String text) {
        if (tts != null) {
            if (ttsReady) speakNow(text);
            else pendingSpeech = text;
            return;
        }
        pendingSpeech = text;
        tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
            @Override
            public void onInit(int status) {
                if (status != TextToSpeech.SUCCESS) {
                    ttsEvent("error");
                    return;
                }
                int r = tts.setLanguage(new Locale("ml", "IN"));
                if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                    ttsEvent("language");
                    return;
                }
                tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                    @Override
                    public void onStart(String utteranceId) {
                    }

                    @Override
                    public void onDone(String utteranceId) {
                        ttsEvent("done");
                    }

                    @Override
                    public void onError(String utteranceId) {
                        ttsEvent("error");
                    }
                });
                ttsReady = true;
                if (pendingSpeech != null) {
                    String t = pendingSpeech;
                    pendingSpeech = null;
                    speakNow(t);
                }
            }
        });
    }

    // ------------------------------------------------------------------ files

    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        Uri uri = (resultCode == RESULT_OK && data != null) ? data.getData() : null;

        if (requestCode == REQ_OPEN) {
            if (fileCallback != null) {
                fileCallback.onReceiveValue(uri == null ? null : new Uri[]{uri});
                fileCallback = null;
            }
        } else if (requestCode == REQ_SAVE) {
            boolean ok = false;
            if (uri != null && pendingSaveText != null) {
                try {
                    OutputStream out = getContentResolver().openOutputStream(uri);
                    if (out != null) {
                        out.write(pendingSaveText.getBytes(StandardCharsets.UTF_8));
                        out.close();
                        ok = true;
                    }
                } catch (Exception ignored) {
                }
            }
            pendingSaveText = null;
            js("window.__thkSaved&&window.__thkSaved(" + ok + "," + JSONObject.quote(pendingSaveName) + "," + (uri == null) + ")");
        }
    }

    // ------------------------------------------------------------------ bridge the page calls

    private class Bridge {

        @JavascriptInterface
        public void startVoice() {
            runOnUiThread(new Runnable() {
                @Override
                public void run() {
                    beginVoice();
                }
            });
        }

        @JavascriptInterface
        public void stopVoice() {
            runOnUiThread(new Runnable() {
                @Override
                public void run() {
                    endVoice();
                }
            });
        }

        @JavascriptInterface
        public void speak(final String text) {
            runOnUiThread(new Runnable() {
                @Override
                public void run() {
                    MainActivity.this.speak(text == null ? "" : text);
                }
            });
        }

        @JavascriptInterface
        public void stopSpeak() {
            runOnUiThread(new Runnable() {
                @Override
                public void run() {
                    pendingSpeech = null;
                    if (tts != null) tts.stop();
                }
            });
        }

        /** Opens Android's save screen. Google Drive appears there as a place to save. */
        @JavascriptInterface
        public void saveFile(final String name, final String mime, final String text) {
            runOnUiThread(new Runnable() {
                @Override
                public void run() {
                    pendingSaveText = text == null ? "" : text;
                    pendingSaveName = name == null ? "script" : name;
                    Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                    i.addCategory(Intent.CATEGORY_OPENABLE);
                    i.setType(mime == null || mime.isEmpty() ? "application/octet-stream" : mime);
                    i.putExtra(Intent.EXTRA_TITLE, pendingSaveName);
                    try {
                        startActivityForResult(i, REQ_SAVE);
                    } catch (ActivityNotFoundException e) {
                        pendingSaveText = null;
                        js("window.__thkSaved&&window.__thkSaved(false," + JSONObject.quote(pendingSaveName) + ",false)");
                    }
                }
            });
        }

        @JavascriptInterface
        public void print(final String title) {
            runOnUiThread(new Runnable() {
                @Override
                public void run() {
                    String job = (title == null || title.trim().isEmpty()) ? "Thirakkatha script" : title.trim();
                    PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                    if (pm != null) {
                        pm.print(job, web.createPrintDocumentAdapter(job), new PrintAttributes.Builder().build());
                    }
                }
            });
        }
    }

    // ------------------------------------------------------------------ lifecycle

    @Override
    public void onBackPressed() {
        web.evaluateJavascript("(window.__thkBack&&window.__thkBack())?1:0", new ValueCallback<String>() {
            @Override
            public void onReceiveValue(String value) {
                if (!"1".equals(value)) moveTaskToBack(true);
            }
        });
    }

    @Override
    protected void onSaveInstanceState(Bundle outState) {
        super.onSaveInstanceState(outState);
        web.saveState(outState);
    }

    @Override
    protected void onPause() {
        js("window.__thkFlush&&window.__thkFlush()");
        if (listening) {
            endVoice();
            voiceEvent("error", "other");
        }
        super.onPause();
    }

    @Override
    protected void onDestroy() {
        if (recognizer != null) {
            recognizer.destroy();
            recognizer = null;
        }
        if (tts != null) {
            tts.stop();
            tts.shutdown();
            tts = null;
        }
        if (web != null) web.destroy();
        super.onDestroy();
    }
}

<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thirakkatha – Malayalam Script Writer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F2B4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thirakkatha">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Noto+Serif+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E7EAEE; --page:#FFFFFF; --panel:#F4F5F8; --ink:#1F2B4D; --muted:#69718A;
  --gold:#B8902F; --gold-soft:#F3E9CF; --line:#D5D9E2; --rec:#C0392B; --ok:#2E7D5B;
  --ui:"Manjari","Noto Sans Malayalam","Nirmala UI",system-ui,sans-serif;
  --script:"Noto Serif Malayalam","Manjari","Nirmala UI",serif;
  --fs:1rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --desk:#11151D; --page:#1A2030; --panel:#161B27; --ink:#E5E8F0; --muted:#98A0B5;
    --gold:#D7B45A; --gold-soft:#3A3322; --line:#2C3447; --rec:#E5604F; --ok:#5DBE95; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --desk:#11151D; --page:#1A2030; --panel:#161B27; --ink:#E5E8F0; --muted:#98A0B5;
  --gold:#D7B45A; --gold-soft:#3A3322; --line:#2C3447; --rec:#E5604F; --ok:#5DBE95; }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--ui);height:100dvh;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

#app{display:flex;height:100%}
#side{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#side .brand{padding:16px 16px 12px;border-bottom:4px double var(--gold);display:flex;align-items:baseline;justify-content:space-between}
#side .brand b{font:700 1.45rem var(--script)}
#side .brand span{font-size:.75rem;color:var(--muted)}
#side .scroll{flex:1;overflow-y:auto;padding:8px 10px 16px}
#side h3{font-size:.8rem;color:var(--muted);margin:14px 6px 6px;font-weight:400}
.navitem{display:flex;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 6px;font:.9rem var(--script);line-height:1.4}
.navitem:hover{background:var(--gold-soft)}
.navitem i{font-style:normal;color:var(--gold);font-family:var(--ui);min-width:1.4em}
.navitem small{margin-left:auto;color:var(--muted);font-family:var(--ui)}
.sidenote{font-size:.82rem;color:var(--muted);padding:4px 6px;line-height:1.5}
#statMini{border-top:1px solid var(--line);padding:10px 16px;font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between}
#sideClose,#sideBtn{display:none}
#scrim{display:none}
@media (max-width:899px){
  #side{position:fixed;inset:0 auto 0 0;z-index:15;transform:translateX(-100%);transition:transform .22s;width:min(300px,86vw);box-shadow:0 0 40px rgba(0,0,0,.25)}
  #app.sideopen #side{transform:none}
  #app.sideopen #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:14}
  #sideBtn{display:grid}
}
#work{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}

header{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;padding-top:max(10px,env(safe-area-inset-top))}
#title{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 1.15rem var(--script);padding:6px 4px;text-overflow:ellipsis}
#title::placeholder{color:var(--muted)}
.icon{border:1px solid var(--line);background:var(--page);border-radius:10px;height:36px;min-width:36px;padding:0 9px;font-size:.9rem;display:grid;place-items:center;flex:none}
.icon.solid{background:var(--ink);color:var(--page);border-color:var(--ink);padding:0 14px}
#saved{font-size:.75rem;color:var(--muted);white-space:nowrap}
@media (max-width:520px){ #saved{display:none} }

#chips,#selBar{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none;align-items:center}
#chips::-webkit-scrollbar,#selBar::-webkit-scrollbar,#cands::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--page);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.chip.danger{border-color:var(--rec);color:var(--rec);background:transparent}
.chip.gold{border-color:var(--gold);color:var(--gold);background:transparent}
#chipHint{flex:none;font-size:.75rem;color:var(--muted);padding-right:2px}

main{flex:1;overflow-y:auto;padding:4px 10px 16px;-webkit-overflow-scrolling:touch}
.page{max-width:700px;margin:0 auto;background:var(--page);min-height:100%;
  border-top:7px double var(--gold);border-bottom:7px double var(--gold);
  padding:30px 26px 60px;font-family:var(--script);font-size:var(--fs);line-height:1.75;counter-reset:scene}
.empty{color:var(--muted);font-family:var(--ui);text-align:center;padding:40px 10px;line-height:1.7;font-size:.95rem}
.empty b{color:var(--ink)}
.blk{outline:none;border-radius:4px;padding:1px 4px;margin:0 -4px;white-space:pre-wrap;word-break:break-word;scroll-margin:80px}
.blk.sel{background:var(--gold-soft)}
.blk.hit{box-shadow:inset 3px 0 0 var(--gold)}
.blk.reading{box-shadow:inset 3px 0 0 var(--ok)}
.blk.scene{font-weight:700;margin-top:1.6em;counter-increment:scene}
.blk.scene::before{content:counter(scene) ". ";color:var(--gold)}
.blk.action{margin-top:.8em}
.blk.character{margin:1em 0 0 36%;font-weight:600}
.blk.paren{margin-left:26%;margin-right:20%;color:var(--muted)}
.blk.dialogue{margin-left:16%;margin-right:12%}
.blk.transition{text-align:right;margin-top:1em;font-weight:600}
.blk.pending{opacity:.55;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.page.two .blk.action{margin-right:50%}
.page.two .blk.character{margin:1em 0 0 52%}
.page.two .blk.paren,.page.two .blk.dialogue{margin-left:52%;margin-right:0}
.here{display:flex;align-items:center;gap:8px;margin:6px 0;font:.75rem var(--ui);color:var(--gold);cursor:pointer}
.here::before,.here::after{content:"";flex:1;border-top:1px dashed var(--gold)}
#printTitle{display:none}
@media (max-width:480px){
  .page{padding:22px 14px 44px}
  .blk.character{margin-left:28%} .blk.paren{margin-left:18%;margin-right:8%} .blk.dialogue{margin-left:9%;margin-right:4%}
}

#findBar{background:var(--panel);border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#findBar input{flex:1;min-width:120px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--page);color:var(--ink);font:.9rem var(--ui);padding:0 10px}
#findInfo{font-size:.78rem;color:var(--muted);width:100%}

#composer{background:var(--page);border-top:1px solid var(--line);padding:6px 10px 8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#cands{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;min-height:40px;align-items:center}
.cand{flex:none;border:1px solid var(--line);background:var(--desk);border-radius:8px;padding:5px 11px;font:1rem var(--script);white-space:nowrap}
.cand.on{border-color:var(--gold);background:var(--gold-soft)}
.cand.eng{font-family:var(--ui);font-size:.85rem;color:var(--muted)}
.candHint{font-size:.78rem;color:var(--muted);flex:none}
#preview{min-height:1.7em;font-family:var(--script);font-size:1.05rem;padding:0 4px 6px;word-break:break-word;line-height:1.6}
#preview .lbl{font-family:var(--ui);font-size:.72rem;color:var(--page);background:var(--ink);border-radius:5px;padding:2px 7px;margin-right:8px;vertical-align:middle}
#preview .w{border-bottom:1px dotted transparent;cursor:pointer}
#preview .w.unsure{border-bottom-color:var(--gold)}
#preview .w.on{background:var(--gold-soft);border-radius:3px}
#preview.listening{color:var(--rec)}
.row{display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--desk);color:var(--ink);font:1rem var(--ui);padding:10px 12px;max-height:120px;min-height:44px}
#mic,#add{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center}
#mic{background:var(--desk);border:1px solid var(--line)}
#mic.on{background:var(--rec);color:#fff;border-color:var(--rec);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--rec) 25%,transparent)}}
#add{background:var(--ink);color:var(--page)}
.opts{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:.78rem;color:var(--muted);gap:8px}
.tog{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-size:.78rem;color:var(--muted)}
.tog .sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--page);transition:left .2s}
.tog[aria-checked="true"] .sw{background:var(--gold)}
.tog[aria-checked="true"] .sw::after{left:14px}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet .box{background:var(--page);color:var(--ink);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px 28px;border-top:6px double var(--gold)}
@media (min-width:700px){ .sheet{align-items:center} .sheet .box{border-radius:16px} }
.box h2{margin:0 0 10px;font-size:1.1rem}
.box h3{margin:18px 0 6px;font-size:.92rem}
.box p,.box li{font-size:.9rem;line-height:1.55}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px 10px;font-size:.88rem}
.keys span b{color:var(--gold);margin-right:4px}
.menu button.item{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 4px;font-size:.95rem}
.menu button.item small{color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 0}
.seg label{font-size:.85rem;color:var(--muted);min-width:76px}
.note{font-size:.82rem;color:var(--muted);margin:8px 0 12px}
.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--desk);color:var(--ink);font:.95rem var(--ui);padding:10px 12px;margin-top:6px}
.list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;font:.95rem var(--script)}
.list small{display:block;color:var(--muted);font:.78rem var(--ui)}
.lrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lrow button:first-child{flex:1;border:0}
.lrow .chip{margin-left:6px}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--desk);font-size:.95rem}
.big.primary{background:var(--ink);color:var(--page);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--desk);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.3rem}
.stats span{font-size:.75rem;color:var(--muted)}
.bar{height:6px;background:var(--gold);border-radius:3px;margin-top:4px}
#aiOut{background:var(--desk);border-radius:10px;padding:12px;margin-top:10px;font:1rem/1.7 var(--script);white-space:pre-wrap}
#aiOut .t{font:.75rem var(--ui);color:var(--muted);display:block}
#toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:10px;font-size:.88rem;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  #side,header,#chips,#selBar,#composer,#findBar,.sheet,#toast,.here,#scrim{display:none!important}
  body{background:#fff;height:auto;overflow:visible} #app,#work{display:block;height:auto} main{overflow:visible;padding:0}
  .page{border:0;color:#000;background:#fff;max-width:none;font-size:12pt}
  .blk.sel,.blk.hit{background:none;box-shadow:none}
  #printTitle{display:flex;flex-direction:column;justify-content:center;align-items:center;height:92vh;page-break-after:always;text-align:center}
  #printTitle h1{font-size:26pt;margin:0 0 20pt} #printTitle p{margin:4pt 0}
  .blk.scene{page-break-after:avoid} .blk.character{page-break-after:avoid}
}
</style>
</head>
<body>
<div id="app">
<aside id="side" aria-label="Scenes and characters">
  <div class="brand"><b>തിരക്കഥ</b><span>Thirakkatha</span></div>
  <div class="scroll">
    <h3>Scenes</h3><div id="sceneNav"></div>
    <h3>Characters</h3><div id="charNav"></div>
  </div>
  <div id="statMini"></div>
</aside>
<div id="scrim"></div>

<div id="work">
<header>
  <button class="icon" id="sideBtn" aria-label="Scenes and characters">☰</button>
  <input id="title" placeholder="Untitled script" autocomplete="off" aria-label="Script title">
  <span id="saved"></span>
  <button class="icon" id="undoBtn" aria-label="Undo" disabled>↶</button>
  <button class="icon" id="redoBtn" aria-label="Redo" disabled>↷</button>
  <button class="icon solid" id="saveBtn">Save</button>
  <button class="icon" id="menuBtn" aria-label="More tools">⋯</button>
</header>

<nav id="chips" aria-label="Line type"><span id="chipHint">Next line:</span></nav>
<div id="selBar" hidden></div>

<main id="main"><div class="page" id="page"><div class="empty">Opening your script…</div></div></main>

<div id="findBar" hidden>
  <input id="findInp" placeholder="Find (Manglish or മലയാളം)" autocapitalize="off" autocomplete="off" spellcheck="false">
  <input id="replInp" placeholder="Replace with" autocapitalize="off" autocomplete="off" spellcheck="false">
  <button class="chip" id="findNext">Find next</button>
  <button class="chip" id="replAll">Replace all</button>
  <button class="chip" id="findClose" aria-label="Close find">Close</button>
  <span id="findInfo"></span>
</div>

<div id="composer">
  <div id="cands" aria-label="Suggestions"></div>
  <div id="preview"></div>
  <div class="row">
    <textarea id="inp" rows="1" placeholder="Type in Manglish… e.g. avan veettilekku varunnu" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-label="Type in Manglish"></textarea>
    <button id="mic" aria-label="Start voice typing">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button id="add" aria-label="Add line">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="opts">
    <button class="tog" id="aiTog" role="switch" aria-checked="true"><span class="sw"></span>AI polish &amp; voice formatting</button>
    <span><b>name: line</b> = dialogue</span>
  </div>
</div>
</div>
</div>

<!-- Typing guide -->
<div class="sheet" id="helpSheet"><div class="box">
  <h2>Typing guide</h2>
  <p>Type Malayalam the way you'd text it in English letters, then press Enter. Type casually: <b>njan veettil pokunnu</b>, <b>ammayude kayyil</b>, <b>santhoshamayi</b> all come out right.</p>
  <h3>When a word comes out wrong</h3>
  <ul>
    <li>Other spellings appear above the typing box. Tap the right one.</li>
    <li>The app remembers your choice and uses it every time after that.</li>
    <li>Tap any word in the preview to fix that word. Words with a gold dotted line are best guesses.</li>
    <li>With AI polish on, guessed words are corrected for you after you press Enter, and the app learns from the corrections.</li>
  </ul>
  <h3>Shortcuts</h3>
  <ul>
    <li><b>raju: nee evide poyi?</b> makes a character and their dialogue in one go.</li>
    <li><b>ALL CAPS</b> stays in English: INT. EXT. CUT TO:</li>
    <li><b>{English}</b> keeps anything in English.</li>
    <li>On a keyboard: <b>Tab</b> changes the line type, <b>Ctrl+Z</b> undo, <b>Ctrl+S</b> save, <b>Ctrl+F</b> find.</li>
  </ul>
  <h3>Voice typing</h3>
  <p>Tap the mic and speak Malayalam. With AI on, speech is sorted into scene, action and dialogue. Without AI, start with <b>സീൻ</b>, <b>ആക്ഷൻ</b>, <b>ഡയലോഗ്</b>, <b>കട്ട് ടു</b> or <b>രാജു പറയുന്നു…</b></p>
  <h3>Exact keys</h3>
  <p class="note">Capital letters always give one exact letter, for when you want full control.</p>
  <div class="keys" id="keyGrid"></div>
  <button class="big" data-close>Got it</button>
</div></div>

<!-- More tools -->
<div class="sheet" id="menuSheet"><div class="box menu">
  <h2>Tools</h2>
  <button class="item" id="libBtn">My scripts<small id="libCount"></small></button>
  <button class="item" id="detailsBtn">Title page details</button>
  <button class="item" id="findBtn">Find and replace</button>
  <button class="item" id="statsBtn">Script statistics</button>
  <button class="item" id="aiBtn">AI writing tools</button>
  <button class="item" id="readBtn">Read script aloud</button>
  <button class="item" id="printBtn">Print or save as PDF</button>
  <button class="item" id="copyBtn">Copy script text</button>
  <button class="item" id="installBtn" hidden>Install as an app</button>
  <button class="item" id="helpBtn">Typing guide</button>
  <h3>View</h3>
  <div class="seg"><label>Layout</label>
    <button class="chip" data-layout="std">Standard</button><button class="chip" data-layout="two">Two-column</button></div>
  <div class="seg"><label>Text size</label>
    <button class="chip" id="fsDown" aria-label="Smaller text">A−</button><button class="chip" id="fsUp" aria-label="Larger text">A+</button></div>
  <div class="seg"><label>Theme</label>
    <button class="chip" data-theme-set="auto">Auto</button><button class="chip" data-theme-set="light">Light</button><button class="chip" data-theme-set="dark">Dark</button></div>
  <button class="big" data-close>Close</button>
</div></div>

<!-- Library -->
<div class="sheet" id="libSheet"><div class="box">
  <h2>My scripts</h2>
  <div class="list" id="libList"></div>
  <button class="big primary" id="newBtn">Start a new script</button>
  <button class="big" data-close>Close</button>
</div></div>

<!-- Title page -->
<div class="sheet" id="detailsSheet"><div class="box">
  <h2>Title page details</h2>
  <p class="note">Shown on the first page when you print, save as PDF, or export.</p>
  <input class="field" id="authorInp" placeholder="Written by" autocomplete="off">
  <input class="field" id="contactInp" placeholder="Phone, email or draft note" autocomplete="off">
  <button class="big primary" data-close>Done</button>
</div></div>

<!-- Stats -->
<div class="sheet" id="statsSheet"><div class="box">
  <h2>Script statistics</h2>
  <div id="statsBody"></div>
  <button class="big" data-close>Close</button>
</div></div>

<!-- AI tools -->
<div class="sheet" id="aiSheet"><div class="box">
  <h2>AI writing tools</h2>
  <p class="note" id="aiTarget"></p>
  <div class="seg" id="aiActs">
    <button class="chip" data-ai="natural">More natural</button>
    <button class="chip" data-ai="short">Shorter</button>
    <button class="chip" data-ai="emotional">More emotional</button>
    <button class="chip" data-ai="funny">Add humour</button>
    <button class="chip" data-ai="english">English translation</button>
  </div>
  <button class="big" id="aiNext">Suggest what happens next</button>
  <button class="big" id="aiSummary">Summarise the script so far</button>
  <div id="aiOut" hidden></div>
  <div class="seg" id="aiUse" hidden>
    <button class="chip gold" id="aiApply">Use this</button>
    <button class="chip" id="aiCopy">Copy</button>
  </div>
  <button class="big" data-close>Close</button>
</div></div>

<!-- Save -->
<div class="sheet" id="saveSheet"><div class="box">
  <h2>Save your script</h2>
  <p class="note" style="margin-top:0">Choose a format</p>
  <div class="seg" id="fmtRow" role="radiogroup" aria-label="File format" style="padding-top:0">
    <button class="chip" data-fmt="script">Script file</button>
    <button class="chip" data-fmt="doc">Word</button>
    <button class="chip" data-fmt="fountain">Fountain</button>
    <button class="chip" data-fmt="txt">Text</button>
  </div>
  <p id="fmtNote" class="note"></p>
  <button class="big primary" id="saveDevice">Save to this device</button>
  <button class="big" id="saveDrive">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0F9D58" d="M8 3h8l7 12h-8z"/><path fill="#FFC107" d="M1 15 8 3l4 7-4 7z"/><path fill="#4285F4" d="M5 21l3.5-6H23l-3.5 6z"/></svg>
    <span>Save to Google Drive</span>
  </button>
  <h3>Open a saved script</h3>
  <button class="big" id="openBtn">Open script file from device</button>
  <button class="big" id="openDrive" hidden>Open from Google Drive</button>
  <div class="list" id="driveList"></div>
  <input type="file" id="openFile" accept=".mlscript,.json,application/json" hidden>
  <h3>Google Drive connection</h3>
  <p class="note" id="driveStatus"></p>
  <div id="driveSetup">
    <input id="clientIdInp" class="field" placeholder="Paste your Google OAuth Client ID" autocomplete="off" spellcheck="false" autocapitalize="off">
    <button class="big" id="clientIdSave">Connect Google Drive</button>
  </div>
  <button class="big" id="driveDisconnect" hidden>Disconnect Google Drive</button>
  <button class="big" data-close>Close</button>
</div></div>

<div id="toast" role="status"></div>

<script>
/* ---------- Your Google Drive setup ----------
   Paste your OAuth Client ID between the quotes to connect Drive for everyone
   using this page, or leave it empty and paste it in the app's Save screen. */
const GOOGLE_CLIENT_ID = "";

/* =====================================================================
   MANGLISH ENGINE
   1. Words you have corrected before (learned)
   2. Built-in dictionary of common words
   3. Context rules for casual spelling (evide, veedu, paranju, kuttikal…)
   Capital letters stay exact: T ട, D ഡ, N ണ, L ള, R റ, S ഷ, A ആ, I ഈ, U ഊ, E ഏ, O ഓ
   ===================================================================== */
const VSIGN={a:["","അ"],aa:["ാ","ആ"],i:["ി","ഇ"],ii:["ീ","ഈ"],u:["ു","ഉ"],uu:["ൂ","ഊ"],e:["െ","എ"],ee:["േ","ഏ"],
  ai:["ൈ","ഐ"],o:["ൊ","ഒ"],oo:["ോ","ഓ"],au:["ൗ","ഔ"],vir:["്","ഉ"]};
const VKEY={aa:1,ai:1,au:1,ou:1,ee:1,ii:1,oo:1,uu:1,ae:1,A:1,I:1,U:1,E:1,O:1,a:1,i:1,u:1,e:1,o:1};
const CKEY={};
("thth chch ksh nth ndh nch tth cch chh kh gh ng nk ch jh nj th dh ph bh sh zh nt nd tt mb ck ll nn dd Th Dh Sh "+
 "k g c q j t d n p f b m y r l v w s h x z T D N L R S").split(" ").forEach(k=>CKEY[k]=1);
const CHILLU={"ന":"ൻ","ണ":"ൺ","ര":"ർ","റ":"ർ","ല":"ൽ","ള":"ൾ","മ":"ം"};
const SOLO=new Set(["ർ","ൽ","ൾ","ൻ","ൺ","ം"]);

function tokenize(w){
  const t=[]; let i=0;
  while(i<w.length){
    if(w[i]==="~"){ t.push({t:"X"}); i++; continue; }
    let m=null;
    for(const L of [4,3,2,1]){ const s=w.substr(i,L); if(s.length===L&&CKEY[s]){ m=s; break; } }
    if(m){ t.push({t:"C",k:m}); i+=m.length; continue; }
    for(const L of [2,1]){ const s=w.substr(i,L); if(s.length===L&&VKEY[s]){ m=s; break; } }
    if(m){ t.push({t:"V",k:m}); i+=m.length; continue; }
    t.push({t:"O",k:w[i]}); i++;
  }
  return t;
}
const U_KEEP=new Set(["j","nn","ch","nj","nd","tt","tth","thth","cch","chch","nt","nth","ndh","nch"]);
function options(tk,i){
  const x=tk[i], p=tk[i-1], n=tk[i+1], k=x.k;
  const first=i===0, last=i===tk.length-1;
  const pV=!!p&&p.t==="V", nV=!!n&&n.t==="V", nC=!!n&&n.t==="C", mid=pV&&nV;
  if(x.t==="V"){
    switch(k){
      case "aa": case "A": return ["aa"];
      case "ee": case "ii": case "I": return ["ii"];
      case "uu": case "U": return ["uu"];
      case "oo": return ["uu","oo"];
      case "ae": case "E": return ["ee"];
      case "O": return ["oo"];
      case "ai": return ["ai"];
      case "au": case "ou": return ["au"];
      case "a": {
        const rest=tk.slice(i+1).map(z=>z.k).join(""), pk=p&&p.t==="C"?p.k:"", pp=tk[i-2]&&tk[i-2].t==="C"?tk[i-2].k:"";
        if(i>0 && rest==="yi") return ["aa","a"];                                   // …ayi → ആയി
        if(rest==="m" && ((pk==="k"&&pp==="k")||(pk==="y"&&pp==="y"))) return ["aa","a"]; // pokkam, cheyyam → ാം
        return ["a","aa"]; }
      case "i": return ["i","ii"];
      case "e": return i>0 && tk.slice(i+1).map(z=>z.k).join("")==="kku" ? ["ee","e"] : ["e","ee"]; // …ekku → േക്ക്
      case "o": return last&&p&&p.t==="C" ? ["oo","o"] : ["o","oo"];
      case "u":
        if(!(last&&p&&p.t==="C")) return ["u","uu"];
        if(p.k==="y") return ["uu","u","vir"];
        if(p.k==="th"){ const b=tk[i-2]; return b&&b.t==="V"&&/^(a|i|e|aa|A|E|ee)$/.test(b.k) ? ["vir","u","uu"] : ["u","vir","uu"]; }
        return U_KEEP.has(p.k) ? ["u","vir","uu"] : ["vir","u","uu"];
    }
  }
  switch(k){
    case "d": return last?["ഡ","ദ"] : mid?["ട","ദ","ഡ"] : ["ദ","ഡ","ട"];
    case "t": return last?["റ്റ","ട്ട","ട"] : mid?["ട","റ്റ","ത"] : ["ട","ത"];
    case "tt": return ["ട്ട","റ്റ","ത്ത"];
    case "th": {
      const rest=tk.slice(i+1).map(z=>z.k).join("");
      if(p&&p.t==="C"&&p.k==="r") return ["ത്ത","ത","ഥ"];                           // nirthi, orthu
