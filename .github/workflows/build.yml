rootProject.name = "Thirakkatha"
include ':app'

    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Thirakkatha.apk

      - name: Attach APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: Thirakkatha-APK
          path: Thirakkatha.apk

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: Thirakkatha APK
          body: Download Thirakkatha.apk below and open it on your Android phone to install.
          files: Thirakkatha.apk
          make_latest: true
